<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>深渊断刃 - 破防与处决</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        input, textarea {
            user-select: text;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        body.scrollable {
            overflow: auto;
            align-items: flex-start;
        }
        #gameWrapper {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 0 60px rgba(200, 50, 50, 0.15), inset 0 0 30px rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
        }
        canvas {
            display: block;
            border-radius: 8px;
            background: #111;
            cursor: none;
            width: 1000px;
            height: 600px;
        }
        #controls {
            color: #888;
            font-size: 12px;
            text-align: center;
            padding: 10px 0 4px;
            letter-spacing: 1px;
            border-top: 1px solid #2a2a2a;
            margin-top: 8px;
            display: none;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        #controls kbd {
            background: #2a2a2a;
            color: #ddd;
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid #444;
            font-size: 11px;
            font-weight: bold;
        }
        #controls span {
            color: #666;
        }
        @media (max-width: 1040px) {
            #gameWrapper {
                padding: 6px;
                border-radius: 8px;
            }
            canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 1000/600;
            }
            #controls {
                font-size: 10px;
                gap: 12px;
                padding: 6px 0 2px;
            }
            #controls kbd {
                font-size: 9px;
                padding: 1px 6px;
            }
        }
        @media (max-width: 600px) {
            #controls {
                font-size: 8px;
                gap: 6px;
                flex-direction: column;
                align-items: center;
            }
            #controls kbd {
                font-size: 8px;
                padding: 1px 4px;
            }
        }
        #authPanel {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.6s;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #authPanel.hide {
            opacity: 0;
            pointer-events: none;
        }
        .auth-box {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 40px 36px;
            width: 380px;
            box-shadow: 0 0 60px rgba(200,50,50,0.12), inset 0 0 30px rgba(0,0,0,0.8);
            position: relative;
        }
        .auth-title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #e74c3c;
            text-shadow: 0 0 30px rgba(200,50,50,0.4);
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 1px solid #333;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            color: #666;
            font-size: 15px;
            cursor: pointer;
            transition: color 0.3s, border-color 0.3s;
            border-bottom: 2px solid transparent;
            letter-spacing: 2px;
        }
        .auth-tab.active {
            color: #e74c3c;
            border-bottom-color: #e74c3c;
        }
        .auth-tab:hover { color: #ccc; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .auth-field {
            margin-bottom: 16px;
        }
        .auth-field label {
            display: block;
            color: #888;
            font-size: 12px;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .auth-field input {
            width: 100%;
            padding: 10px 14px;
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            color: #ddd;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .auth-field input:focus {
            border-color: #c0392b;
        }
        .auth-field input::placeholder {
            color: #444;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: #c0392b;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 3px;
            transition: background 0.3s, transform 0.2s;
            margin-top: 8px;
        }
        .auth-btn:hover { background: #e74c3c; transform: scale(1.02); }
        .auth-btn:active { transform: scale(0.98); }
        .auth-msg {
            text-align: center;
            font-size: 12px;
            margin-top: 12px;
            min-height: 18px;
            transition: opacity 0.3s;
        }
        .auth-msg.error { color: #e74c3c; }
        .auth-msg.success { color: #2ecc71; }
        .auth-user-bar {
            position: absolute;
            top: 12px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 50;
        }
        .auth-user-bar .user-name {
            color: #aaa;
            font-size: 12px;
        }
        .auth-user-bar .logout-btn {
            color: #666;
            font-size: 11px;
            cursor: pointer;
            padding: 3px 8px;
            border: 1px solid #333;
            border-radius: 4px;
            transition: color 0.3s, border-color 0.3s;
        }
        .auth-user-bar .logout-btn:hover {
            color: #e74c3c;
            border-color: #e74c3c;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: #c0392b;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 6px;
            transition: opacity 0.8s;
        }
        #loading .sub {
            color: #666;
            font-size: 14px;
            margin-top: 16px;
            letter-spacing: 2px;
            font-weight: normal;
        }
        #loading .bar {
            width: 200px;
            height: 3px;
            background: #222;
            margin-top: 24px;
            border-radius: 2px;
            overflow: hidden;
        }
        #loading .bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #c0392b, #e74c3c);
            border-radius: 2px;
            transition: width 0.3s;
        }
        #loading.hide {
            opacity: 0;
            pointer-events: none;
        }
        #gameOverlay {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 1000px;
            height: 600px;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            pointer-events: auto;
            z-index: 100;
            flex-direction: column;
        }
        #gameOverlay.show {
            display: flex;
        }
        #gameOverlay .title {
            font-size: 48px;
            font-weight: bold;
            color: #e74c3c;
            text-shadow: 0 0 40px rgba(200, 50, 50, 0.5);
            letter-spacing: 4px;
        }
        #gameOverlay .subtitle {
            color: #aaa;
            font-size: 18px;
            margin-top: 12px;
        }
        #gameOverlay .btn {
            margin-top: 28px;
            padding: 12px 40px;
            background: #c0392b;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.3s, transform 0.2s;
            font-weight: bold;
            letter-spacing: 2px;
        }
        #gameOverlay .btn:hover {
            background: #e74c3c;
            transform: scale(1.04);
        }
        #gameOverlay .btn:active {
            transform: scale(0.96);
        }
        @media (max-width: 1040px) {
            #gameOverlay {
                width: 100%;
                height: auto;
                aspect-ratio: 1000/600;
                top: 6px;
                left: 6px;
            }
            #gameOverlay .title {
                font-size: 32px;
            }
            #gameOverlay .subtitle {
                font-size: 14px;
            }
            #gameOverlay .btn {
                padding: 8px 24px;
                font-size: 14px;
            }
        }
        /* ===== 开始界面 ===== */
        #startScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, #1a0a12 0%, #0a0a0a 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 900;
            transition: opacity 0.8s;
            overflow: hidden;
        }
        #startScreen.hide {
            opacity: 0;
            pointer-events: none;
        }
        .start-bg-particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        .start-bg-particles .sp {
            position: absolute;
            border-radius: 50%;
            background: rgba(200, 50, 50, 0.15);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(0.3); opacity: 0; }
        }
        .start-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .start-logo {
            margin-bottom: 30px;
        }
        .start-logo-icon {
            font-size: 72px;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(200, 50, 50, 0.5));
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .start-title {
            font-size: 56px;
            font-weight: bold;
            color: #e74c3c;
            text-shadow: 0 0 60px rgba(200, 50, 50, 0.6), 0 4px 20px rgba(0,0,0,0.8);
            letter-spacing: 12px;
            margin-top: 10px;
        }
        .start-subtitle {
            font-size: 20px;
            color: #888;
            letter-spacing: 8px;
            margin-top: 8px;
        }
        .start-desc {
            color: #666;
            font-size: 14px;
            max-width: 400px;
            margin: 0 auto 40px;
            line-height: 1.8;
            letter-spacing: 1px;
        }
        .start-btns {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .start-btn {
            padding: 14px 36px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #1a1a1a;
            color: #aaa;
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .start-btn:hover {
            border-color: #888;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }
        .start-btn.primary {
            background: #c0392b;
            border-color: #c0392b;
            color: #fff;
        }
        .start-btn.primary:hover {
            background: #e74c3c;
            border-color: #e74c3c;
            box-shadow: 0 6px 30px rgba(200,50,50,0.4);
        }

        /* ===== 新手教程 ===== */
        #tutorialOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 950;
        }
        #tutorialOverlay.show {
            display: flex;
        }
        .tutorial-box {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            width: 520px;
            max-width: 90vw;
            box-shadow: 0 0 60px rgba(200, 50, 50, 0.1);
            overflow: hidden;
        }
        .tutorial-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 28px;
            border-bottom: 1px solid #2a2a2a;
        }
        .tutorial-title {
            font-size: 22px;
            font-weight: bold;
            color: #e74c3c;
            letter-spacing: 4px;
        }
        .tutorial-step-indicator {
            color: #666;
            font-size: 13px;
        }
        .tutorial-body {
            padding: 28px;
            min-height: 260px;
        }
        .tutorial-step-icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 16px;
        }
        .tutorial-step-title {
            font-size: 20px;
            color: #ddd;
            font-weight: bold;
            text-align: center;
            margin-bottom: 14px;
            letter-spacing: 2px;
        }
        .tutorial-step-desc {
            color: #999;
            font-size: 14px;
            text-align: center;
            line-height: 1.9;
        }
        .tutorial-keys {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .tutorial-keys kbd {
            background: #2a2a2a;
            color: #ddd;
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid #555;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            min-width: 36px;
            text-align: center;
        }
        .tutorial-tip {
            background: rgba(200, 50, 50, 0.1);
            border-left: 3px solid #c0392b;
            padding: 10px 14px;
            margin-top: 14px;
            border-radius: 0 6px 6px 0;
            color: #aaa;
            font-size: 13px;
            line-height: 1.7;
        }
        .tutorial-footer {
            display: flex;
            justify-content: space-between;
            padding: 16px 28px;
            border-top: 1px solid #2a2a2a;
        }
        .tutorial-btn {
            padding: 10px 28px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1a1a1a;
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .tutorial-btn:hover {
            border-color: #888;
            color: #fff;
        }
        .tutorial-btn.primary {
            background: #c0392b;
            border-color: #c0392b;
            color: #fff;
        }
        .tutorial-btn.primary:hover {
            background: #e74c3c;
        }
        .tutorial-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== 暂停界面 ===== */
        #pauseOverlay {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 1000px;
            height: 600px;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 8px;
            z-index: 100;
            flex-direction: column;
        }
        #pauseOverlay.show {
            display: flex;
        }
        #pauseOverlay .pause-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        #pauseOverlay .pause-title {
            font-size: 36px;
            font-weight: bold;
            color: #ddd;
            letter-spacing: 8px;
            margin-bottom: 8px;
        }
        #pauseOverlay .pause-sub {
            color: #666;
            font-size: 14px;
            margin-bottom: 28px;
        }
        #pauseOverlay .pause-btns {
            display: flex;
            gap: 12px;
        }
        #pauseOverlay .pause-btn {
            padding: 12px 32px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1a1a1a;
            color: #aaa;
            font-size: 15px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s;
            font-family: inherit;
        }
        #pauseOverlay .pause-btn:hover {
            border-color: #888;
            color: #fff;
            transform: translateY(-1px);
        }
        #pauseOverlay .pause-btn.primary {
            background: #c0392b;
            border-color: #c0392b;
            color: #fff;
        }
        #pauseOverlay .pause-btn.primary:hover {
            background: #e74c3c;
        }

        /* ---- Mobile Touch Controls ---- */
        #mobileControls {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 1000;
        }
        #mobileControls.show {
            display: block;
        }
        .mobile-joystick {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.2);
            pointer-events: auto;
            touch-action: none;
        }
        .mobile-joystick-thumb {
            position: absolute;
            top: 50%; left: 50%;
            width: 50px; height: 50px;
            margin: -25px 0 0 -25px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            border: 2px solid rgba(255,255,255,0.5);
            pointer-events: none;
            transition: none;
        }
        .mobile-btns {
            position: absolute;
            bottom: 20px;
            right: 15px;
            pointer-events: auto;
            touch-action: none;
        }
        .mobile-btn-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .mobile-btn {
            width: 62px; height: 62px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            pointer-events: auto;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        .mobile-btn:active, .mobile-btn.active {
            background: rgba(255,255,255,0.35);
            border-color: rgba(255,255,255,0.6);
        }
        .mobile-btn.attack {
            width: 78px; height: 78px;
            background: rgba(255,100,50,0.25);
            border-color: rgba(255,100,50,0.5);
            font-size: 16px;
        }
        .mobile-btn.attack:active, .mobile-btn.attack.active {
            background: rgba(255,100,50,0.5);
        }
        .mobile-btn.block {
            background: rgba(68,170,255,0.2);
            border-color: rgba(68,170,255,0.5);
        }
        .mobile-btn.block:active, .mobile-btn.block.active {
            background: rgba(68,170,255,0.45);
        }
        .mobile-btn.dodge {
            background: rgba(136,221,255,0.2);
            border-color: rgba(136,221,255,0.5);
        }
        .mobile-btn.dodge:active, .mobile-btn.dodge.active {
            background: rgba(136,221,255,0.45);
        }
        .mobile-btn.skill-q {
            width: 54px; height: 54px;
            background: rgba(102,204,255,0.2);
            border-color: rgba(102,204,255,0.4);
            font-size: 12px;
        }
        .mobile-btn.skill-q:active, .mobile-btn.skill-q.active {
            background: rgba(102,204,255,0.45);
        }
        .mobile-btn.skill-e {
            width: 54px; height: 54px;
            background: rgba(255,136,68,0.2);
            border-color: rgba(255,136,68,0.4);
            font-size: 12px;
        }
        .mobile-btn.skill-e:active, .mobile-btn.skill-e.active {
            background: rgba(255,136,68,0.45);
        }
        .mobile-btn .btn-label {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 1px;
        }
        .mobile-items {
            position: absolute;
            bottom: 200px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
            touch-action: none;
        }
        .mobile-item-btn {
            width: 44px; height: 44px;
            border-radius: 8px;
            border: 1.5px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            pointer-events: auto;
            touch-action: none;
        }
        .mobile-item-btn .item-count {
            font-size: 9px;
            opacity: 0.7;
        }
        .mobile-item-btn:active, .mobile-item-btn.active {
            background: rgba(255,255,255,0.25);
        }
        .mobile-pause-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
        }
        .mobile-skin-btn {
            position: absolute;
            top: 12px;
            right: 60px;
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
        }

        @media (hover: none) and (pointer: coarse) {
            #mobileControls { display: none; }
            #controls { display: none !important; }
            #gameWrapper { width: 100vw !important; height: 100vh !important; max-width: 100% !important; }
            canvas { width: 100% !important; height: 100% !important; display: block; }
            #startScreen { width: 100vw !important; height: 100vh !important; }
            #authPanel {
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;

</head>
<body>

    <div id="startScreen">
        <div class="start-bg-particles" id="startParticles"></div>
        <div class="start-content">
            <div class="start-logo">
                <div class="start-logo-icon">⚔</div>
                <div class="start-title">深渊断刃</div>
                <div class="start-subtitle">破防与处决</div>
            </div>
            <div class="start-desc">在无尽的黑暗深渊中，只有完美的格挡与冷酷的处决才能让你存活。</div>
            <div class="start-btns">
                <button class="start-btn primary" id="startPlayBtn">开始游戏</button>
                <button class="start-btn" id="startTutorialBtn">新手教程</button>
            </div>
        </div>
    </div>

    <div id="tutorialOverlay">
        <div class="tutorial-box">
            <div class="tutorial-header">
                <div class="tutorial-title">新手教程</div>
                <div class="tutorial-step-indicator" id="tutorialStepIndicator">1 / 6</div>
            </div>
            <div class="tutorial-body" id="tutorialBody"></div>
            <div class="tutorial-footer">
                <button class="tutorial-btn" id="tutorialPrevBtn">上一步</button>
                <button class="tutorial-btn primary" id="tutorialNextBtn">下一步</button>
            </div>
        </div>
    </div>

    <div id="authPanel">
        <div class="auth-box">
            <div class="auth-title">⚔ 深渊断刃</div>
            <div class="auth-subtitle">登录以保存你的战斗记录</div>
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">登录</div>
                <div class="auth-tab" data-tab="register">注册</div>
            </div>
            <form class="auth-form active" id="loginForm">
                <div class="auth-field">
                    <label>用户名</label>
                    <input type="text" id="loginUser" placeholder="请输入用户名" autocomplete="username" maxlength="16">
                </div>
                <div class="auth-field">
                    <label>密码</label>
                    <input type="password" id="loginPass" placeholder="请输入密码" autocomplete="current-password" maxlength="32">
                </div>
                <button type="submit" class="auth-btn">进入战场</button>
                <div class="auth-msg" id="loginMsg"></div>
            </form>
            <form class="auth-form" id="registerForm">
                <div class="auth-field">
                    <label>用户名</label>
                    <input type="text" id="regUser" placeholder="2-16位字母数字" autocomplete="username" maxlength="16">
                </div>
                <div class="auth-field">
                    <label>密码</label>
                    <input type="password" id="regPass" placeholder="至少6位" autocomplete="new-password" maxlength="32">
                </div>
                <div class="auth-field">
                    <label>确认密码</label>
                    <input type="password" id="regPass2" placeholder="再次输入密码" autocomplete="new-password" maxlength="32">
                </div>
                <button type="submit" class="auth-btn">创建账号</button>
                <div class="auth-msg" id="regMsg"></div>
            </form>
        </div>
    </div>

    <div id="loading">
        <div>⚔ 深渊断刃</div>
        <div class="sub">破防 · 处决</div>
        <div class="bar"><div class="fill" id="loadFill"></div></div>
    </div>

    <div id="gameWrapper">
        <div style="position:relative;display:inline-block;">
            <div class="auth-user-bar" id="userBar" style="display:none;">
                <span class="user-name" id="userBarName"></span>
                <span class="logout-btn" id="logoutBtn">退出登录</span>
            </div>
            <canvas id="gameCanvas" width="1000" height="600"></canvas>
            <div id="gameOverlay">
                <div class="title" id="overlayTitle">败北</div>
                <div class="subtitle" id="overlaySub">你倒在了黑暗中...</div>
                <button class="btn" id="restartBtn">再次挑战</button>
            </div>
            <div id="pauseOverlay">
                <div class="pause-icon">⏸</div>
                <div class="pause-title">暂停</div>
                <div class="pause-sub">按 ESC 继续游戏</div>
                <div class="pause-btns">
                    <button class="pause-btn primary" id="resumeBtn">继续游戏</button>
                    <button class="pause-btn" id="pauseRestartBtn">重新开始</button>
                </div>
            </div>
        </div>
        <div id="controls">
            <span><kbd>WASD</kbd> 移动</span>
            <span><kbd>J</kbd> 攻击/处决</span>
            <span><kbd>K</kbd> 格挡 (破防时机)</span>
            <span><kbd>L</kbd> 闪避 (无消耗)</span>
            <span><kbd>1-4</kbd> 道具</span>
            <span><kbd>Q</kbd> 剑气 <kbd>E</kbd> 旋风斩</span>
            <span><kbd>C</kbd> 换皮肤</span>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="mobileControls">
        <div class="mobile-joystick" id="joystick">
            <div class="mobile-joystick-thumb" id="joystickThumb"></div>
        </div>
        <div class="mobile-items" id="mobileItems">
            <div class="mobile-item-btn" data-key="1"><span>❤</span><span class="item-count" id="itemCount1">3</span></div>
            <div class="mobile-item-btn" data-key="2"><span>⚡</span><span class="item-count" id="itemCount2">2</span></div>
            <div class="mobile-item-btn" data-key="3"><span>⚔</span><span class="item-count" id="itemCount3">1</span></div>
            <div class="mobile-item-btn" data-key="4"><span>🛡</span><span class="item-count" id="itemCount4">1</span></div>
        </div>
        <div class="mobile-btns">
            <div class="mobile-btn-row">
                <div class="mobile-btn skill-q" data-key="q">Q<span class="btn-label">剑气</span></div>
                <div class="mobile-btn skill-e" data-key="e">E<span class="btn-label">旋风</span></div>
            </div>
            <div class="mobile-btn-row">
                <div class="mobile-btn block" data-key="k">🛡<span class="btn-label">格挡</span></div>
                <div class="mobile-btn attack" data-key="j">⚔<span class="btn-label">攻击</span></div>
                <div class="mobile-btn dodge" data-key="l">💨<span class="btn-label">闪避</span></div>
            </div>
        </div>
        <div class="mobile-pause-btn" id="mobilePauseBtn">⏸</div>
        <div class="mobile-skin-btn" id="mobileSkinBtn">👤</div>
    </div>

    <script>
        // ============================================================
        //  深渊断刃 - 破防与处决版
        //  调整：完美格挡判定窗口 0.15→0.2，近战敌人移速降低约15%
        // ============================================================

        // ---------- 账号系统 ----------
        const AUTH_KEY = 'darkSoulUsers';
        const SESSION_KEY = 'darkSoulSession';

        function getUsers() {
            try { return JSON.parse(localStorage.getItem(AUTH_KEY)) || {}; }
            catch(e) { return {}; }
        }
        function saveUsers(users) {
            localStorage.setItem(AUTH_KEY, JSON.stringify(users));
        }
        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const c = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + c;
                hash |= 0;
            }
            const salt = 'darkSoul_' + str.length + '_2024';
            let h2 = 0;
            for (let i = 0; i < salt.length; i++) {
                const c = salt.charCodeAt(i);
                h2 = ((h2 << 5) - h2) + c;
                h2 |= 0;
            }
            return String(hash) + '_' + String(h2);
        }
        function getSession() {
            try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); }
            catch(e) { return null; }
        }
        function setSession(user) {
            sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username: user }));
        }
        function clearSession() {
            sessionStorage.removeItem(SESSION_KEY);
        }

        let currentUser = null;

        function showAuthMsg(el, text, type) {
            el.textContent = text;
            el.className = 'auth-msg ' + type;
        }

        const authPanel = document.getElementById('authPanel');
        const userBar = document.getElementById('userBar');
        const userBarName = document.getElementById('userBarName');
        const logoutBtn = document.getElementById('logoutBtn');

        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                const target = tab.dataset.tab;
                document.getElementById(target === 'login' ? 'loginForm' : 'registerForm').classList.add('active');
                document.getElementById('loginMsg').textContent = '';
                document.getElementById('regMsg').textContent = '';
            });
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            const msg = document.getElementById('loginMsg');
            if (!user || !pass) { showAuthMsg(msg, '请填写所有字段', 'error'); return; }
            const users = getUsers();
            if (!users[user]) { showAuthMsg(msg, '账号不存在', 'error'); return; }
            if (users[user] !== simpleHash(pass)) { showAuthMsg(msg, '密码错误', 'error'); return; }
            currentUser = user;
            setSession(user);
            showAuthMsg(msg, '登录成功！', 'success');
            setTimeout(() => enterGame(), 600);
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value;
            const pass2 = document.getElementById('regPass2').value;
            const msg = document.getElementById('regMsg');
            if (!user || !pass || !pass2) { showAuthMsg(msg, '请填写所有字段', 'error'); return; }
            if (user.length < 2 || user.length > 16) { showAuthMsg(msg, '用户名需2-16位', 'error'); return; }
            if (!/^[a-zA-Z0-9_\u4e00-\u9fa5]+$/.test(user)) { showAuthMsg(msg, '用户名仅支持字母数字下划线或中文', 'error'); return; }
            if (pass.length < 6) { showAuthMsg(msg, '密码至少6位', 'error'); return; }
            if (pass !== pass2) { showAuthMsg(msg, '两次密码不一致', 'error'); return; }
            const users = getUsers();
            if (users[user]) { showAuthMsg(msg, '用户名已存在', 'error'); return; }
            users[user] = simpleHash(pass);
            saveUsers(users);
            showAuthMsg(msg, '注册成功！请登录', 'success');
            setTimeout(() => {
                document.querySelectorAll('.auth-tab')[0].click();
                document.getElementById('loginUser').value = user;
                document.getElementById('loginPass').value = '';
            }, 800);
        });

        logoutBtn.addEventListener('click', () => {
            clearSession();
            currentUser = null;
            userBar.style.display = 'none';
            authPanel.classList.remove('hide');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginMsg').textContent = '';
            var mc = document.getElementById('mobileControls');
            if (mc) mc.classList.remove('show');
            state = GameState.MENU;
        });

        function enterGame() {
            authPanel.classList.add('hide');
            userBar.style.display = 'flex';
            userBarName.textContent = '⚔ ' + currentUser;
            showStartScreen();
        }

        // 检查是否已有登录会话
        (function checkSession() {
            const s = getSession();
            if (s && s.username) {
                const users = getUsers();
                if (users[s.username]) {
                    currentUser = s.username;
                    userBar.style.display = 'flex';
                    userBarName.textContent = '⚔ ' + currentUser;
                    authPanel.classList.add('hide');
                    showStartScreen();
                    return;
                }
            }
            document.getElementById('loading').classList.add('hide');
        })();

        // ---------- 开始界面 ----------
        const startScreen = document.getElementById('startScreen');
        const tutorialOverlay = document.getElementById('tutorialOverlay');
        const tutorialBody = document.getElementById('tutorialBody');
        const tutorialStepIndicator = document.getElementById('tutorialStepIndicator');
        const tutorialPrevBtn = document.getElementById('tutorialPrevBtn');
        const tutorialNextBtn = document.getElementById('tutorialNextBtn');
        let currentTutorialStep = 0;

        // 生成浮动粒子
        (function createStartParticles() {
            const container = document.getElementById('startParticles');
            for (let i = 0; i < 30; i++) {
                const sp = document.createElement('div');
                sp.className = 'sp';
                const size = 3 + Math.random() * 8;
                sp.style.width = size + 'px';
                sp.style.height = size + 'px';
                sp.style.left = Math.random() * 100 + '%';
                sp.style.top = (80 + Math.random() * 30) + '%';
                sp.style.animationDuration = (6 + Math.random() * 10) + 's';
                sp.style.animationDelay = (-Math.random() * 10) + 's';
                container.appendChild(sp);
            }
        })();

        function showStartScreen() {
            startScreen.classList.remove('hide');
            document.getElementById('loading').classList.add('hide');
        }

        document.getElementById('startPlayBtn').addEventListener('click', () => {
            startScreen.classList.add('hide');
            setTimeout(() => { start(); }, 400);
        });

        document.getElementById('startTutorialBtn').addEventListener('click', () => {
            currentTutorialStep = 0;
            showTutorial();
        });

        // ---------- 新手教程 ----------
        const tutorialSteps = [
            {
                icon: '🏃',
                title: '移动',
                desc: '使用 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制角色向上下左右移动。在战斗中保持移动可以躲避敌人的攻击。',
                keys: ['W', 'A', 'S', 'D'],
                tip: '移动时你的角色会自动朝向移动方向。'
            },
            {
                icon: '⚔️',
                title: '攻击',
                desc: '按 <kbd>J</kbd> 进行近战攻击。攻击有一定的范围和角度，靠近敌人后出刀即可造成伤害。连续攻击可以积累连击。',
                keys: ['J'],
                tip: '攻击时会消耗少量耐力，注意观察耐力条。'
            },
            {
                icon: '🛡️',
                title: '格挡与完美格挡',
                desc: '按住 <kbd>K</kbd> 进入格挡姿态。在敌人攻击即将命中时（0.2秒窗口内）按 <kbd>K</kbd> 可触发完美格挡，直接破防敌人！',
                keys: ['K'],
                tip: '完美格挡后敌人会进入破防状态（出现 ⚠ 标记），此时按 J 可执行致命处决！'
            },
            {
                icon: '💨',
                title: '闪避',
                desc: '按 <kbd>L</kbd> 或 <kbd>空格</kbd> 进行闪避翻滚。闪避过程中无敌，可以穿过敌人的攻击。可以搭配方向键控制闪避方向。',
                keys: ['L', 'Space'],
                tip: '闪避几乎没有冷却时间，是保命的核心技巧。'
            },
            {
                icon: '🌊',
                title: '技能与道具',
                desc: '按 <kbd>Q</kbd> 释放剑气斩（远程波形攻击），按 <kbd>E</kbd> 释放旋风斩（近距离范围攻击）。<kbd>1</kbd>-<kbd>4</kbd> 使用快捷栏道具。',
                keys: ['Q', 'E', '1', '2', '3', '4'],
                tip: '技能会消耗耐力，合理分配耐力是战斗的关键。'
            },
            {
                icon: '👑',
                title: '战斗策略',
                desc: '面对Boss时，优先使用完美格挡破防 → 处决造成大量伤害。普通敌人可以闪避绕后攻击。注意耐力管理，不要贪刀！',
                keys: [],
                tip: '按 <kbd>C</kbd> 可以切换角色皮肤。处决击杀后会获得短暂无敌时间。'
            }
        ];

        function showTutorial() {
            tutorialOverlay.classList.add('show');
            renderTutorialStep();
        }

        function hideTutorial() {
            tutorialOverlay.classList.remove('show');
        }

        function renderTutorialStep() {
            const step = tutorialSteps[currentTutorialStep];
            const total = tutorialSteps.length;
            tutorialStepIndicator.textContent = (currentTutorialStep + 1) + ' / ' + total;

            let keysHtml = '';
            if (step.keys.length > 0) {
                keysHtml = '<div class="tutorial-keys">' + step.keys.map(k => '<kbd>' + k + '</kbd>').join('') + '</div>';
            }

            let tipHtml = '';
            if (step.tip) {
                tipHtml = '<div class="tutorial-tip">' + step.tip + '</div>';
            }

            tutorialBody.innerHTML =
                '<div class="tutorial-step-icon">' + step.icon + '</div>' +
                '<div class="tutorial-step-title">' + step.title + '</div>' +
                '<div class="tutorial-step-desc">' + step.desc + '</div>' +
                keysHtml + tipHtml;

            tutorialPrevBtn.disabled = currentTutorialStep === 0;
            tutorialNextBtn.textContent = currentTutorialStep === total - 1 ? '开始游戏' : '下一步';
        }

        tutorialPrevBtn.addEventListener('click', () => {
            if (currentTutorialStep > 0) {
                currentTutorialStep--;
                renderTutorialStep();
            }
        });

        tutorialNextBtn.addEventListener('click', () => {
            if (currentTutorialStep < tutorialSteps.length - 1) {
                currentTutorialStep++;
                renderTutorialStep();
            } else {
                hideTutorial();
                startScreen.classList.add('hide');
                setTimeout(() => { start(); }, 300);
            }
        });

        tutorialOverlay.addEventListener('click', (e) => {
            if (e.target === tutorialOverlay) {
                hideTutorial();
            }
        });

        // ---------- 加载画面 ----------
        let loadProgress = 0;
        const loadFill = document.getElementById('loadFill');
        const loading = document.getElementById('loading');

        function updateLoad(prog) {
            loadProgress = Math.min(prog, 100);
            loadFill.style.width = loadProgress + '%';
            if (loadProgress >= 100) {
                setTimeout(() => loading.classList.add('hide'), 300);
            }
        }

        // ---------- Canvas 设置 ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 1000,
            H = 600;

        const overlay = document.getElementById('gameOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySub = document.getElementById('overlaySub');
        const restartBtn = document.getElementById('restartBtn');

        // ---------- Audio System (Web Audio API - synthesized) ----------
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playSound(type) {
            try {
                const ctx = getAudioCtx();
                const t = ctx.currentTime;
                const g = ctx.createGain();
                g.connect(ctx.destination);
                const o = ctx.createOscillator();
                const n = ctx.createBufferSource();
                if (type === 'swing') {
                    // 剑挥舞 - 快速下降音

                    // 普通格挡 - 中等金属碰
                    o.type = 'triangle'; o.frequency.setValueAtTime(500, t);
                    o.frequency.exponentialRampToValueAtTime(120, t + 0.1);
                    g.gain.setValueAtTime(0.2, t);

                    const o2 = ctx.createOscillator();

                    o.type = 'square'; o.frequency.setValueAtTime(1200, t);

                    g.gain.setValueAtTime(0.35, t);
                    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
                    o.connect(g); o.start(t); o.stop(t + 0.4);
                    // 低频冲击波
                    o2.type = 'sine'; o2.frequency.setValueAtTime(80, t);
                    o2.frequency.exponentialRampToValueAtTime(20, t + 0.5);
                    g2.gain.setValueAtTime(0.4, t);
                    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
                    o2.connect(g2); o2.start(t); o2.stop(t + 0.6);

                    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.25 * (1 - i / data.length);
                    n.buffer = buf; n.connect(g); n.start(t + 0.02); n.stop(t + 0.32);

                    // 破防 - 极强回响

                    const g2 = ctx.createGain();

                    const g3 = ctx.createGain();
                    g3.connect(ctx.destination);
                    o.type = 'sawtooth'; o.frequency.setValueAtTime(1500, t);
                    o.frequency.exponentialRampToValueAtTime(100, t + 0.6);
                    g.gain.setValueAtTime(0.3, t);
                    g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
                    o.connect(g); o.start(t); o.stop(t + 0.7);
                    o2.type = 'sine'; o2.frequency.setValueAtTime(60, t);
                    o2.frequency.exponentialRampToValueAtTime(15, t + 0.8);

                    o3.connect(g3); o3.start(t); o3.stop(t + 0.5);
                } else if (type === 'execute') {
                    // 处决 - 深沉斩击
                    o.type = 'sawtooth'; o.frequency.setValueAtTime(400, t);
                    o.frequency.exponentialRampToValueAtTime(50, t + 0.5);
                    g.gain.setValueAtTime(0.3, t);

            levelComplete = false;
            const enemyList = [];
            lv.enemies.forEach(e => {
                for (let i = 0; i < e.count; i++) {
                    enemyList.push(e.type);
                }
            });
            if (lv.boss && lv.bossType) {
                enemyList.push(lv.bossType);
            }
            for (let i = enemyList.length - 1; i > 0; i--) {
                const j = randInt(0, i);
                [enemyList[i], enemyList[j]] = [enemyList[j], enemyList[i]];
            }
            window._enemyQueue = enemyList;
            window._enemyIndex = 0;
            totalEnemiesInWave = enemyList.length;
            isWaveActive = true;
            addFloatingText(W / 2, 120, '⚔ ' + lv.name, '#f0c040', 36, 80);
            if (lv.boss) {
                addFloatingText(W / 2, 170, '⚠ BOSS 降临 ⚠', '#e74c3c', 28, 70);
            }
            spawnEnemiesFromQueue(3);
            updateLoad(100);
        }

        function spawnEnemiesFromQueue(count) {
            const queue = window._enemyQueue || [];
            let spawned = 0;
            while (spawned < count && window._enemyIndex < queue.length) {
                const type = queue[window._enemyIndex];
                window._enemyIndex++;
                const pos = getSpawnPosition();
                const enemy = createEnemy(type, pos.x, pos.y);
                enemies.push(enemy);
                if (enemy.isBoss && !enemy.isMiniBoss) bossActive = true;
                spawned++;
                enemiesSpawned++;
            }
            if (window._enemyIndex >= queue.length) {
                isWaveActive = false;
            }
        }

            let x, y;
            const margin = 40;
            if (side === 0) { x = rand(margin, W - margin);
                y = -margin; } else if (side === 1) { x = rand(margin, W - margin);
                y = H + margin; } else if (side === 2) { x = -margin;
                y = rand(margin, H - margin); } else { x = W + margin;
                y = rand(margin, H - margin); }
            while (dist({ x, y }, player) < 200) {
                x = rand(50, W - 50);
                y = rand(50, H - 50);
            }
            return { x, y };
        }

        function createEnemy(type, x, y) {
            const tpl = ENEMY_TEMPLATES[type];
            const isBoss = tpl.isBoss || false;
            const isMiniBoss = tpl.isMiniBoss || false;
            const attackCooldown = (tpl.attackCooldownMin !== undefined) ?
                rand(tpl.attackCooldownMin, tpl.attackCooldownMax) :
                (tpl.attackCooldown || 2.5);
            const enemy = {
                type: type,
                x: x,
                y: y,
                radius: tpl.radius,
                hp: tpl.hp,
                maxHp: tpl.maxHp,
                speed: tpl.speed,
                attack: tpl.attack,
                defense: tpl.defense,
                attackRange: tpl.attackRange,
                attackCooldown: attackCooldown,
                maxAttackCooldown: attackCooldown,
                exp: tpl.exp,
                color: tpl.color,
                score: tpl.score,
                aggroRange: tpl.aggroRange,
                attackDelay: tpl.attackDelay || 0.5,
                isBoss: isBoss,
                isMiniBoss: isMiniBoss,
                isRanged: tpl.isRanged || false,
                projectileSpeed: tpl.projectileSpeed || 0,
                projectileDamage: tpl.projectileDamage || 0,
                state: 'idle',
                stateTimer: 0,
                attackTimer: 0,
                hitTimer: 0,
                facing: rand(0, Math.PI * 2),
                hitCooldown: 0,
                isDead: false,
                dying: false,
                deathTimer: 0,
                animTimer: 0,
                phase: 1,
                phase2: false,
                specialAttackTimer: 0,
                specialCooldown: 0,
                chaseTimer: 0,
                wanderAngle: rand(0, Math.PI * 2),
                wanderTimer: 0,
                hitFlash: 0,
                homeX: x,
                homeY: y,
                attackEffect: 0,
                blockChance: tpl.blockChance || 0,
                dodgeChance: tpl.dodgeChance || 0,
                isBlocking: false,
                isDodging: false,
                dodgeTimer: 0,
            blockTimer: 0,
            blockStartup: 0,
            blockRecovery: 0,
                invincible: 0,
                attackAnim: 0,
                effectColor: tpl.effectColor || '#ff8844',
                attackEffectTimer: 0,
                attackEffectActive: false,
                isParried: false,
                parryTimer: 0,
                parryCount: tpl.maxParryCount || 0,
                maxParryCount: tpl.maxParryCount || 0,
                weaponVisible: true,
                idealDist: tpl.attackRange * (tpl.idealDistFactor || 0.9),
                walkCycle: Math.random() * 10,
                armSwing: 0,
            };
            if (isBoss) {
                enemy.specialCooldown = 3;
                enemy.specialAttackTimer = 0;
                enemy.phase2 = false;
                enemy.phase = 1;
            }
            return enemy;
        }

        // ---------- 战斗系统 ----------
        function playerAttack() {
            if (player.isAttacking) return;
            if (player.attackCooldown > 0) return;
            if (player.isDodging) return;
            if (player.hitCooldown > 0) return;
            if (player.isExecuting) return;
            if (player.stamina < 5) {
                addFloatingText(player.x, player.y - 40, '耐力不足!', '#ff6b6b', 16, 30);
                return;
            }
            // 处决检查
            let executeTarget = null;
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if (e.isDead || e.dying) continue;
                if (e.isParried && dist(player, e) < player.attackRange + e.radius) {
                    const ang = angle(player, e);
                    let diff = ang - player.facing;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    if (Math.abs(diff) < player.attackAngle / 2) {
                        executeTarget = e;
                        break;
                    }
                }
            }

            if (executeTarget) {
                triggerExecute(executeTarget);
                return;
            }

            // 普通攻击
            player.isAttacking = true;
            player.attackDuration = 0.25;
            player.attackCooldown = 0.7;
            player.stamina -= 5;
            playSound('swing');
            player.combo = (player.comboTime > 0) ? player.combo + 1 : 1;
            player.comboTime = 1.0;
            player.attackDir = player.facing;
            player.attackAnim = 1;
            player.armSwing = -1;

            const atkDamage = player.attack + (player.activeBuffs.attack ? player.activeBuffs.attack.value : 0);
            const atkRange = player.attackRange;
            const atkAngle = player.attackAngle;

            let hitCount = 0;
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.isDead || e.dying) continue;
                if (e.isParried) continue;
                const d = dist(player, e);
                if (d > atkRange + e.radius) continue;
                const ang = angle(player, e);
                let diff = ang - player.facing;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                if (Math.abs(diff) < atkAngle / 2) {
                    const dmg = Math.round(Math.max(1, atkDamage - e.defense + rand(-2, 2)));
                    damageEnemy(e, dmg);
                    hitCount++;
                    playSound('hit');
                    const knockAngle = angle(player, e);
                    e.x += Math.cos(knockAngle) * 12;
                    e.y += Math.sin(knockAngle) * 12;
                    screenShake = Math.max(screenShake, 4);
                    spawnParticles(e.x, e.y, '#ff6b35', 12, 4);
                    spawnParticles(e.x, e.y, '#ffcc66', 6, 2);
                }
            }
            if (hitCount > 0) {
                spawnParticles(player.x + Math.cos(player.facing) * 30, player.y + Math.sin(player.facing) * 30, '#ffaa44', 10,
                    5);
                screenShake = Math.max(screenShake, 4);
            } else {
                spawnParticles(player.x + Math.cos(player.facing) * 30, player.y + Math.sin(player.facing) * 30, '#88aacc', 4,
                    2);
            }
            for (let i = 0; i < 12; i++) {
                const ang = player.facing + rand(-0.5, 0.5);
                const dist2 = rand(20, 60);
                particles.push({
                    x: player.x + Math.cos(ang) * dist2,
                    y: player.y + Math.sin(ang) * dist2,
                    vx: Math.cos(ang) * rand(1, 3),
                    vy: Math.sin(ang) * rand(1, 3),
                    life: rand(0.2, 0.5),
                    maxLife: 0.5,
                    radius: rand(3, 6),
                    color: '#ffcc66',
                    decay: 0.96
                });
            }
            for (let i = 0; i < 8; i++) {
                player.trail.push({
                    x: player.x + Math.cos(player.facing + rand(-0.3, 0.3)) * rand(20, 40),
                    y: player.y + Math.sin(player.facing + rand(-0.3, 0.3)) * rand(20, 40),
                    life: 0.4
                });
            }
        }

        function triggerExecute(enemy) {
            if (enemy.isDead || enemy.dying) return;
            player.isExecuting = true;
            player.executeTimer = 0.5;
            player.invincible = 0.6;
            enemy.isDead = true;
            enemy.dying = true;
            enemy.deathTimer = 0.8;
            playSound('execute');
            spawnParticles(enemy.x, enemy.y, '#ffd700', 50, 12);
            spawnParticles(enemy.x, enemy.y, '#ff6600', 30, 8);
            spawnParticles(enemy.x, enemy.y, '#ffaa00', 40, 10);
            screenShake = Math.max(screenShake, 15);
            addFloatingText(enemy.x, enemy.y - 50, '💀 处决!', '#ffaa00', 36, 60);
            addFloatingText(enemy.x, enemy.y + 30, '+' + (enemy.exp * 1.5) + ' EXP', '#88ff88', 20, 50);
            player.kills++;
            player.exp += Math.floor(enemy.exp * 1.5);
            checkLevelUp();
            if (Math.random() < 0.3) {
                const itemIdx = randInt(0, player.items.length - 1);
                const item = player.items[itemIdx];
                if (item) {
                    item.count = (item.count || 0) + 1;
                    addFloatingText(enemy.x, enemy.y - 70, '+' + item.icon + ' ' + item.name, '#88ddff', 18, 40);
                }
            }
            player.killInvincible = 0.6;
            if (enemy.isBoss && !enemy.isMiniBoss) {
                bossDefeated = true;
                bossActive = false;
                addFloatingText(W / 2, 200, '💀 BOSS 被处决!', '#ffd700', 36, 80);
                screenShake = 20;
                setTimeout(() => {
                    if (state === GameState.PLAYING) {
                        if (currentLevel >= LEVELS.length - 1) {
                            state = GameState.VICTORY;
                            showOverlay('胜利', '你击败了深渊王座之主，成为了新的暗魂之王！', true);
                        } else {
                            levelComplete = true;
                            levelTransition = 60;
                        }
                    }
                }, 500);
            } else if (enemy.isMiniBoss) {
                checkWaveComplete();
            }
        }

        function damageEnemy(enemy, damage) {
            if (enemy.isDead || enemy.dying) return;
            if (enemy.isParried) return;

            if (enemy.isBoss && !enemy.isDead && !enemy.isRanged) {
                if (Math.random() < enemy.blockChance && !enemy.isDodging) {
                    enemy.isBlocking = true;
                    enemy.blockTimer = 0.2;
                    const reduced = Math.floor(damage * 0.4);
                    const actual = Math.max(1, reduced);
                    enemy.hp -= actual;
                    enemy.hitFlash = 0.15;
                    addFloatingText(enemy.x, enemy.y - 30, '🛡️ 格挡!', '#44aaff', 20, 30);
                    spawnParticles(enemy.x, enemy.y, '#44aaff', 10, 4);
                    if (enemy.hp <= 0) {
                        enemy.isDead = true;
                        enemy.dying = true;
                        enemy.deathTimer = 0.8;
                        spawnParticles(enemy.x, enemy.y, '#ffaa00', 30, 8);
                        spawnParticles(enemy.x, enemy.y, '#ff4400', 20, 6);
                        screenShake = Math.max(screenShake, 8);
                        addFloatingText(enemy.x, enemy.y - 40, '💀 击杀!', '#ffdd44', 24, 50);
                        addFloatingText(enemy.x, enemy.y + 20, '+' + enemy.exp + ' EXP', '#88ff88', 18, 40);
                        triggerKillInvincible();
                        if (enemy.isBoss && !enemy.isMiniBoss) {
                            bossDefeated = true;
                            bossActive = false;
                            addFloatingText(W / 2, 200, '💀 BOSS 被击败!', '#ffd700', 36, 80);
                            screenShake = 15;
                            setTimeout(() => {
                                if (state === GameState.PLAYING) {
                                    if (currentLevel >= LEVELS.length - 1) {
                                        state = GameState.VICTORY;
                                        showOverlay('胜利', '你击败了深渊王座之主，成为了新的暗魂之王！', true);
                                    } else {
                                        levelComplete = true;
                                        levelTransition = 60;
                                    }
                                }
                            }, 500);
                        } else if (enemy.isMiniBoss) {
                            checkWaveComplete();
                        }
                        return;
                    }
                    enemy.state = 'idle';
                    enemy.hitTimer = 0;
                    enemy.attackCooldown = rand(enemy.attackCooldownMin || 2.5, enemy.attackCooldownMax || 3.5);
                    return;
                }
                if (Math.random() < enemy.dodgeChance && !enemy.isBlocking) {
                    enemy.isDodging = true;
                    enemy.dodgeTimer = 0.3;
                    enemy.invincible = 0.3;
                    const ang = enemy.facing + Math.PI;
                    enemy.x += Math.cos(ang) * 30;
                    enemy.y += Math.sin(ang) * 30;
                    spawnParticles(enemy.x, enemy.y, '#88ddff', 10, 4);
                    addFloatingText(enemy.x, enemy.y - 30, '💨 闪避!', '#88ddff', 20, 30);
                    return;
                }
            }

            enemy.hp -= damage;
            enemy.hitFlash = 0.2;
            enemy.hitTimer = 0.15;
            enemy.state = 'hit';
            addDamageNumber(enemy.x, enemy.y - 20, damage, '#ff6b35');
            spawnParticles(enemy.x, enemy.y, '#ff4444', 6, 4);
            if (enemy.hp <= 0) {
                enemy.isDead = true;
                enemy.dying = true;
                enemy.deathTimer = 0.8;
                enemy.hp = 0;
                player.kills++;
                player.exp += enemy.exp;
                if (Math.random() < 0.2) {
                    const itemIdx = randInt(0, player.items.length - 1);
                    const item = player.items[itemIdx];
                    if (item) {
                        item.count = (item.count || 0) + 1;
                        addFloatingText(enemy.x, enemy.y - 50, '+' + item.icon + ' ' + item.name, '#88ddff', 18, 40);
                    }
                }
                checkLevelUp();
                spawnParticles(enemy.x, enemy.y, '#ffaa00', 30, 8);
                spawnParticles(enemy.x, enemy.y, '#ff4400', 20, 6);
                screenShake = Math.max(screenShake, 8);
                addFloatingText(enemy.x, enemy.y - 40, '💀 击杀!', '#ffdd44', 24, 50);
                addFloatingText(enemy.x, enemy.y + 20, '+' + enemy.exp + ' EXP', '#88ff88', 18, 40);
                triggerKillInvincible();
                if (enemy.isBoss && !enemy.isMiniBoss) {
                    bossDefeated = true;
                    bossActive = false;
                    addFloatingText(W / 2, 200, '💀 BOSS 被击败!', '#ffd700', 36, 80);
                    screenShake = 15;
                    setTimeout(() => {
                        if (state === GameState.PLAYING) {
                            if (currentLevel >= LEVELS.length - 1) {
                                state = GameState.VICTORY;
                                showOverlay('胜利', '你击败了深渊王座之主，成为了新的暗魂之王！', true);
                            } else {
                                levelComplete = true;
                                levelTransition = 60;
                            }
                        }
                    }, 500);
                } else if (enemy.isMiniBoss) {
                    checkWaveComplete();
                }
            }
            checkWaveComplete();
        }

        function triggerKillInvincible() {
            player.killInvincible = 0.8;
            player.invincible = 0.8;
            addFloatingText(player.x, player.y - 30, '✨ 击杀无敌!', '#ffd700', 24, 40);
            spawnParticles(player.x, player.y, '#ffd700', 20, 5);
            for (let i = 0; i < 16; i++) {
                const ang = (i / 16) * Math.PI * 2;
                const dist2 = player.radius + 12 + rand(0, 4);
                particles.push({
                    x: player.x + Math.cos(ang) * dist2,
                    y: player.y + Math.sin(ang) * dist2,
                    vx: Math.cos(ang) * rand(0.5, 1.5),
                    vy: Math.sin(ang) * rand(0.5, 1.5),
                    life: rand(0.3, 0.6),
                    maxLife: 0.6,
                    radius: rand(3, 5),
                    color: '#ffd700',
                    decay: 0.97
                });
            }
            screenShake = Math.max(screenShake, 3);
        }

        function checkWaveComplete() {
            const alive = enemies.filter(e => !e.isDead && !e.dying);
            if (alive.length === 0 && !isWaveActive && !bossActive) {
                if (currentLevel >= LEVELS.length - 1 && bossDefeated) {} else if (!levelComplete) {
                    levelComplete = true;
                    levelTransition = 60;
                }
            }
        }

        function checkLevelUp() {
            const needed = player.level * 20 + 10;
            if (player.exp >= needed) {
                player.exp -= needed;
                player.level++;
                player.maxHp += 10;
                player.hp = Math.min(player.hp + 25, player.maxHp);
                player.attack += 2;
                player.defense += 1;
                playSound('levelUp');
                addFloatingText(player.x, player.y - 60, '⬆ LEVEL UP!', '#ffd700', 30, 60);
                spawnParticles(player.x, player.y, '#ffd700', 25, 8);
                screenShake = 6;
                player.stamina = Math.min(player.stamina + 30, player.maxStamina);
                checkLevelUp();
            }
        }

        // ---------- 玩家受击 ----------
        function damagePlayer(damage, attacker) {
            if (player.invincible > 0) return;
            if (player.isDodging) return;
            if (player.isExecuting) return;

            if (player.isBlocking) {
                if (player.blockTimer < 0.185) {
                    // ===== 完美格挡 - 极强反馈 =====
                    playSound('parry');
                    timeScale = 0.15;
                    screenFlash = { r: 180, g: 220, b: 255, a: 0.9, life: 0.35 };
                    if (attacker && !attacker.isDead && !attacker.dying && !attacker.isParried) {
                        if (attacker.maxParryCount > 0) {
                            attacker.parryCount--;
                            attacker.hitTimer = 0.3;
                            attacker.hitFlash = 0.3;
                            attacker.state = 'hit';
                            screenShake = Math.max(screenShake, 12);
                            // 大量火花粒子
                            for (let i = 0; i < 35; i++) {
                                const ang = rand(0, Math.PI * 2);
                                const spd = rand(3, 12);
                                particles.push({
                                    x: player.x + Math.cos(player.facing) * 25,
                                    y: player.y + Math.sin(player.facing) * 25,
                                    vx: Math.cos(ang) * spd,
                                    vy: Math.sin(ang) * spd,
                                    life: rand(0.4, 1.0),
                                    maxLife: 1.0,
                                    radius: rand(2, 6),
                                    color: ['#44aaff', '#88ddff', '#ffffff', '#aaeeff'][Math.floor(rand(0, 4))],
                                    decay: 0.96
                                });
                            }
                            // 冲击波环特效
                            skillEffects.push({
                                type: 'e_shockwave',
                                x: player.x,
                                y: player.y,
                                life: 0.5,
                                maxLife: 0.5,
                                radius: 10
                            });
                            skillEffects.push({
                                type: 'e_shockwave',
                                x: player.x,
                                y: player.y,
                                life: 0.7,
                                maxLife: 0.7,
                                radius: 5
                            });
                            const remaining = attacker.parryCount;
                            if (remaining > 0) {
                                addFloatingText(attacker.x, attacker.y - 40, '⚡ 完美格挡! (' + remaining + '次)', '#44aaff', 26, 45);
                                addDamageNumber(attacker.x, attacker.y - 20, '⚡', '#44aaff');
                            } else {
                                // Boss破防 - 极致特效
                                attacker.isParried = true;
                                attacker.parryTimer = 4.0;
                                attacker.weaponVisible = false;
                                attacker.state = 'idle';
                                attacker.hitCooldown = 2.0;
                                attacker.parryCount = attacker.maxParryCount;
                                playSound('perfectGuard');
                                timeScale = 0.08;
                                screenFlash = { r: 255, g: 220, b: 100, a: 1.0, life: 0.5 };
                                addFloatingText(attacker.x, attacker.y - 40, '💀 破防! 处决!', '#ffdd44', 32, 65);
                                spawnParticles(attacker.x, attacker.y, '#ffdd44', 60, 14);
                                spawnParticles(attacker.x, attacker.y, '#ffff88', 40, 10);
                                spawnParticles(attacker.x, attacker.y, '#ffffff', 20, 8);
                                screenShake = Math.max(screenShake, 22);
                                // 三层冲击波环
                                for (let w = 0; w < 3; w++) {
                                    skillEffects.push({
                                        type: 'e_shockwave',
                                        x: attacker.x,
                                        y: attacker.y,
                                        life: 0.6 + w * 0.15,
                                        maxLife: 0.6 + w * 0.15,
                                        radius: 5 + w * 10
                                    });
                                }
                                for (let i = 0; i < 24; i++) {
                                    const ang = rand(0, Math.PI * 2);
                                    const spd = rand(4, 12);
                                    particles.push({
                                        x: attacker.x + Math.cos(attacker.facing) * attacker.radius * 0.8,
                                        y: attacker.y + Math.sin(attacker.facing) * attacker.radius * 0.8,
                                        vx: Math.cos(ang) * spd,
                                        vy: Math.sin(ang) * spd - 2,
                                        life: rand(0.8, 1.5),
                                        maxLife: 1.5,
                                        radius: rand(3, 8),
                                        color: '#c0b0a0',
                                        decay: 0.97
                                    });
                                }
                            }
                        } else {
                            // 普通敌人直接破防 - 极致特效
                            attacker.isParried = true;
                            attacker.parryTimer = 3.0;
                            attacker.weaponVisible = false;
                            attacker.state = 'idle';
                            attacker.hitCooldown = 2.0;
                            playSound('perfectGuard');
                            timeScale = 0.1;
                            screenFlash = { r: 255, g: 220, b: 100, a: 1.0, life: 0.5 };
                            addFloatingText(attacker.x, attacker.y - 40, '⚡ 破防! 处决!', '#ffdd44', 30, 55);
                            spawnParticles(attacker.x, attacker.y, '#ffdd44', 50, 12);
                            spawnParticles(attacker.x, attacker.y, '#ffff88', 30, 8);
                            spawnParticles(attacker.x, attacker.y, '#ffffff', 15, 6);
                            screenShake = Math.max(screenShake, 18);
                            for (let w = 0; w < 2; w++) {
                                skillEffects.push({
                                    type: 'e_shockwave',
                                    x: attacker.x,
                                    y: attacker.y,
                                    life: 0.5 + w * 0.15,
                                    maxLife: 0.5 + w * 0.15,
                                    radius: 5 + w * 8
                                });
                            }
                            for (let i = 0; i < 18; i++) {
                                const ang = rand(0, Math.PI * 2);
                                const spd = rand(3, 9);
                                particles.push({
                                    x: attacker.x + Math.cos(attacker.facing) * attacker.radius * 0.8,
                                    y: attacker.y + Math.sin(attacker.facing) * attacker.radius * 0.8,
                                    vx: Math.cos(ang) * spd,
                                    vy: Math.sin(ang) * spd - 2,
                                    life: rand(0.6, 1.2),
                                    maxLife: 1.2,
                                    radius: rand(3, 7),
                                    color: '#c0b0a0',
                                    decay: 0.97
                                });
                            }
                        }
                    }
                    player.invincible = 0.2;
                    return;
                } else {
                    const staminaCost = 5;
                    if (player.stamina < staminaCost) {
                        playSound('parryFail');
                        const actualDmg = Math.round(Math.max(1, damage - player.defense + rand(-2, 2)));
                        player.hp -= actualDmg;
                        player.invincible = 0.3;
                        player.hitFlash = 0.2;
                        player.hitCooldown = 0.2;
                        screenShake = Math.max(screenShake, 6);
                        spawnParticles(player.x, player.y, '#ff2222', 15, 5);
                        addDamageNumber(player.x, player.y - 30, '-' + actualDmg, '#ff2222');
                        if (player.hp <= 0) { player.hp = 0;
                            gameOver(false); }
                        return;
                    }
                    player.stamina -= staminaCost;
                    const reduced = Math.floor(damage * 0.25);
                    const actual = Math.max(1, reduced);
                    player.hp -= actual;
                    playSound('block');
                    spawnParticles(player.x, player.y, '#44aaff', 15, 5);
                    spawnParticles(player.x + Math.cos(player.facing) * 20, player.y + Math.sin(player.facing) * 20, '#88ddff', 8, 3);
                    screenShake = Math.max(screenShake, 5);
                    addDamageNumber(player.x, player.y - 30, '🛡 ' + actual, '#44aaff');
                    if (player.hp <= 0) { player.hp = 0;
                        gameOver(false); }
                    player.invincible = 0.15;
                    player.hitFlash = 0.15;
                    return;
                }
            }

            if (player.activeBuffs.shield) {
                const shield = player.activeBuffs.shield;
                shield.value -= 1;
                if (shield.value <= 0) delete player.activeBuffs.shield;
                spawnParticles(player.x, player.y, '#88ddff', 12, 5);
                addFloatingText(player.x, player.y - 30, '🛡 护盾抵挡!', '#88ddff', 18, 30);
                return;
            }

            const actualDmg = Math.round(Math.max(1, damage - player.defense + rand(-2, 2)));
            player.hp -= actualDmg;
            player.invincible = 0.3;
            player.hitFlash = 0.2;
            player.hitCooldown = 0.2;
            playSound('hurt');
            screenShake = Math.max(screenShake, 6);
            spawnParticles(player.x, player.y, '#ff2222', 15, 5);
            addDamageNumber(player.x, player.y - 30, '-' + actualDmg, '#ff2222');
            if (player.hp <= 0) { player.hp = 0;
                gameOver(false); }
        }

        // ---------- 技能 ----------
        function useSkill(skillKey) {
