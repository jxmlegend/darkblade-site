            if (player.isDodging) return;
            if (player.hitCooldown > 0) return;
            if (player.isExecuting) return;
            const skill = player.skills[skillKey];
            if (!skill) return;
            if (skill.cooldown > 0) {
                addFloatingText(player.x, player.y - 50, '⏳ 冷却中', '#ff6b6b', 14, 25);
                return;
            }
            if (player.stamina < skill.cost) {
                addFloatingText(player.x, player.y - 50, '⚡ 耐力不足', '#ff6b6b', 14, 25);
                return;
            }
            player.stamina -= skill.cost;
            skill.cooldown = skill.maxCooldown;
            if (skillKey === 'q') {
                playSound('skillQ');
                // 剑气斩 - 蓄力特效
                skillEffects.push({
                    type: 'q_charge',
                    x: player.x,
                    y: player.y,
                    facing: player.facing,
                    life: 0.3,
                    maxLife: 0.3
                });
                const proj = {
                    x: player.x + Math.cos(player.facing) * 30,
                    y: player.y + Math.sin(player.facing) * 30,
                    vx: Math.cos(player.facing) * 8,
                    vy: Math.sin(player.facing) * 8,
                    radius: 10,
                    damage: skill.damage + (player.activeBuffs.attack ? player.activeBuffs.attack.value : 0),
                    life: 1.2,
                    owner: 'player',
                    trail: [],
                    color: '#66ccff'
                };
                projectiles.push(proj);
                spawnParticles(proj.x, proj.y, '#66ccff', 15, 6);
                spawnParticles(proj.x, proj.y, '#aaeeff', 8, 3);
                screenShake = Math.max(screenShake, 4);
                addFloatingText(player.x, player.y - 40, '🌊 剑气斩!', '#66ccff', 20, 35);
                // 剑气波纹
                skillEffects.push({
                    type: 'q_wave',
                    x: player.x,
                    y: player.y,
                    facing: player.facing,
                    life: 0.4,
                    maxLife: 0.4,
                    radius: 0
                });
            } else if (skillKey === 'e') {
                playSound('skillE');
                const range = skill.range || 60;
                const damage = skill.damage + (player.activeBuffs.attack ? player.activeBuffs.attack.value : 0);
                let hitCount = 0;
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    if (e.isDead || e.dying) continue;
                    if (e.isParried) continue;
                    if (dist(player, e) < range + e.radius) {
                        const dmg = Math.round(Math.max(1, damage - e.defense + rand(-2, 2)));
                        damageEnemy(e, dmg);
                        hitCount++;
                        const ka = angle(player, e);
                        e.x += Math.cos(ka) * 25;
                        e.y += Math.sin(ka) * 25;
                    }
                }
                // 旋风斩特效 - 多层旋转刀刃
                for (let i = 0; i < 8; i++) {
                    skillEffects.push({
                        type: 'e_blade',
                        x: player.x,
                        y: player.y,
                        angle: (i / 8) * Math.PI * 2,
                        life: 0.5,
                        maxLife: 0.5,
                        radius: range + 10
                    });
                }
                // 冲击波环
                skillEffects.push({
                    type: 'e_shockwave',
                    x: player.x,
                    y: player.y,
                    life: 0.4,
                    maxLife: 0.4,
                    radius: 10
                });
                // 中心旋涡
                skillEffects.push({
                    type: 'e_vortex',
                    x: player.x,
                    y: player.y,
                    life: 0.6,
                    maxLife: 0.6,
                    angle: 0
                });
                spawnParticles(player.x, player.y, '#ff8844', 30, 10);
                spawnParticles(player.x, player.y, '#ffcc44', 15, 6);
                screenShake = Math.max(screenShake, 10);
                addFloatingText(player.x, player.y - 40, '🌀 旋风斩!', '#ff8844', 20, 35);
                if (hitCount === 0) {
                    addFloatingText(player.x, player.y + 20, '...空了', '#888', 14, 25);
                }
            }
        }

        // ---------- 道具 ----------
        function useItem(slot) {
            const idx = slot - 1;
            if (idx < 0 || idx >= player.items.length) return;
            const item = player.items[idx];
            if (!item || item.count <= 0) {
                addFloatingText(player.x, player.y - 40, '❌ 没有道具', '#ff6b6b', 14, 25);
                return;
            }
            if (item.id === 'hpPotion') {
                const heal = item.heal || 30;
                player.hp = Math.min(player.maxHp, player.hp + heal);
                addFloatingText(player.x, player.y - 50, '+' + heal + ' HP', '#ff6b6b', 20, 35);
                spawnParticles(player.x, player.y, '#ff6b6b', 8, 4);
            } else if (item.id === 'staminaPotion') {
                const restore = item.healStamina || 40;
                player.stamina = Math.min(player.maxStamina, player.stamina + restore);
                addFloatingText(player.x, player.y - 50, '+' + restore + ' 耐力', '#ffdd44', 20, 35);
                spawnParticles(player.x, player.y, '#ffdd44', 8, 4);
            } else if (item.id === 'attackBoost') {
                const buff = {
                    type: 'attack',
                    value: item.value || 8,
                    duration: item.duration || 6,
                    timer: 0
                };
                player.activeBuffs.attack = buff;
                addFloatingText(player.x, player.y - 50, '⚔ 攻击强化!', '#ff8844', 20, 35);
                spawnParticles(player.x, player.y, '#ff8844', 12, 5);
            } else if (item.id === 'shield') {
                const buff = {
                    type: 'shield',
                    value: item.value || 1,
                    duration: item.duration || 5,
                    timer: 0
                };
                player.activeBuffs.shield = buff;
                addFloatingText(player.x, player.y - 50, '🛡 护盾!', '#44ddff', 20, 35);
                spawnParticles(player.x, player.y, '#44ddff', 12, 5);
            }
            item.count--;
        }

        // ---------- 敌人AI ----------
        function updateEnemyAI(enemy, dt) {
            if (enemy.isDead || enemy.dying) return;

            if (enemy.isParried) {
                enemy.parryTimer -= dt;
                if (enemy.parryTimer <= 0) {
                    enemy.isParried = false;
                    enemy.weaponVisible = true;
                    addFloatingText(enemy.x, enemy.y - 20, '破防恢复', '#888', 16, 30);
                }
                enemy.hitCooldown = Math.max(0, enemy.hitCooldown - dt);
                return;
            }

            enemy.animTimer += dt;
            enemy.hitFlash = Math.max(0, enemy.hitFlash - dt);

            if (enemy.isBlocking) {
                enemy.blockTimer -= dt;
                if (enemy.blockTimer <= 0) enemy.isBlocking = false;
            }
            if (enemy.isDodging) {
                enemy.dodgeTimer -= dt;
                if (enemy.dodgeTimer <= 0) {
                    enemy.isDodging = false;
                    enemy.invincible = 0;
                }
            }
            if (enemy.invincible > 0) enemy.invincible -= dt;

            if (enemy.attackEffectActive) {
                enemy.attackEffectTimer -= dt;
                if (enemy.attackEffectTimer <= 0) enemy.attackEffectActive = false;
            }

            if (enemy.hitTimer > 0) {
                enemy.hitTimer -= dt;
                if (enemy.hitTimer <= 0 && enemy.state === 'hit') {
                    enemy.state = 'idle';
                }
                return;
            }
            if (enemy.hitCooldown > 0) {
                enemy.hitCooldown -= dt;
                return;
            }

            const distToPlayer = dist(enemy, player);
            const isBoss = enemy.isBoss || false;
            const isRanged = enemy.isRanged || false;

            if (isBoss && !enemy.isMiniBoss) {
                if (enemy.hp < enemy.maxHp * 0.4 && !enemy.phase2) {
                    enemy.phase2 = true;
                    enemy.phase = 2;
                    enemy.speed *= 1.3;
                    enemy.attack += 6;
                    addFloatingText(enemy.x, enemy.y - 50, '🔥 第二阶段!', '#ff4444', 28, 50);
                    spawnParticles(enemy.x, enemy.y, '#ff2222', 30, 10);
                    screenShake = 10;
                }
                enemy.specialCooldown = Math.max(0, enemy.specialCooldown - dt);
                if (enemy.specialCooldown <= 0 && distToPlayer < 300 && enemy.state !== 'attack') {
                    enemy.specialCooldown = rand(3, 6) * rand(0.7, 1.3);
                    const wave = {
                        x: enemy.x,
                        y: enemy.y,
                        vx: 0,
                        vy: 0,
                        radius: 20,
                        maxRadius: 130,
                        life: 0.6,
                        damage: enemy.attack * 0.7,
                        owner: 'enemy',
                        attacker: enemy
                    };
                    projectiles.push(wave);
                    spawnParticles(enemy.x, enemy.y, '#aa44ff', 20, 8);
                    screenShake = 8;
                    addFloatingText(enemy.x, enemy.y - 40, '💥 暗影冲击!', '#aa44ff', 22, 40);
                }
            }

            if (enemy.state === 'idle') {
                enemy.wanderTimer -= dt;
                if (enemy.wanderTimer <= 0) {
                    enemy.wanderAngle = rand(0, Math.PI * 2);
                    enemy.wanderTimer = rand(1, 3);
                }
                if (distToPlayer < enemy.aggroRange) {
                    enemy.state = 'chase';
                    enemy.chaseTimer = 0;
                } else {
                    enemy.x += Math.cos(enemy.wanderAngle) * enemy.speed * 0.3 * dt * 60;
                    enemy.y += Math.sin(enemy.wanderAngle) * enemy.speed * 0.3 * dt * 60;
                    enemy.facing = enemy.wanderAngle;
                }
            } else if (enemy.state === 'chase') {
                enemy.chaseTimer += dt;
                if (isRanged) {
                    const idealDist = enemy.idealDist || (enemy.attackRange * 0.9);
                    const currentDist = distToPlayer;
                    enemy.facing = angle(enemy, player);
                    if (currentDist < idealDist * 0.7) {
                        const ang = angle(enemy, player) + Math.PI;
                        enemy.x += Math.cos(ang) * enemy.speed * dt * 60 * 0.8;
                        enemy.y += Math.sin(ang) * enemy.speed * dt * 60 * 0.8;
                    } else if (currentDist > idealDist * 1.3) {
                        const ang = angle(enemy, player);
                        enemy.x += Math.cos(ang) * enemy.speed * dt * 60 * 0.6;
                        enemy.y += Math.sin(ang) * enemy.speed * dt * 60 * 0.6;
                    } else {
                        const ang = angle(enemy, player) + Math.PI / 2 * (Math.random() > 0.5 ? 1 : -1);
                        enemy.x += Math.cos(ang) * enemy.speed * dt * 60 * 0.3;
                        enemy.y += Math.sin(ang) * enemy.speed * dt * 60 * 0.3;
                    }
                    if (distToPlayer > enemy.aggroRange * 1.5) {
                        enemy.state = 'idle';
                        enemy.wanderTimer = 1;
                    }
                    enemy.x = clamp(enemy.x, -20, W + 20);
                    enemy.y = clamp(enemy.y, -20, H + 20);
                } else {
                    if (distToPlayer > enemy.aggroRange * 1.3) {
                        enemy.state = 'idle';
                        enemy.wanderTimer = 1;
                    } else if (distToPlayer < enemy.attackRange) {
                        enemy.state = 'attack';
                        enemy.attackTimer = enemy.attackDelay;
                    } else {
                        const ang = angle(enemy, player);
                        enemy.facing = ang;
                        const speed = enemy.speed * (isBoss && enemy.phase2 ? 1.3 : 1);
                        enemy.x += Math.cos(ang) * speed * dt * 60;
                        enemy.y += Math.sin(ang) * speed * dt * 60;
                        if (enemy.chaseTimer > 2) {
                            enemy.x += Math.cos(ang + 0.5) * 0.3;
                            enemy.y += Math.sin(ang + 0.5) * 0.3;
                        }
                    }
                }
            } else if (enemy.state === 'attack') {
                enemy.attackTimer -= dt;
                enemy.facing = angle(enemy, player);
                if (enemy.attackTimer <= 0) {
                    if (distToPlayer < enemy.attackRange + player.radius) {
                        const dmg = enemy.attack + (isBoss && enemy.phase2 ? 6 : 0);
                        damagePlayer(dmg, enemy);
                        screenShake = Math.max(screenShake, 5);
                        spawnParticles(player.x, player.y, '#ff4444', 12, 5);
                        if (isBoss) {
                            screenShake = Math.max(screenShake, 10);
                            spawnParticles(enemy.x, enemy.y, '#aa44ff', 20, 8);
                        }
                        enemy.attackEffectActive = true;
                        enemy.attackEffectTimer = 0.3;
                        enemy.attackAnim = 1;
                        enemy.armSwing = 1;
                    }
                    enemy.state = 'idle';
                    const baseCD = rand(enemy.attackCooldownMin || 2.5, enemy.attackCooldownMax || 3.5);
                    enemy.attackCooldown = baseCD * rand(0.6, 1.4) + (Math.random() < 0.15 ? rand(0.5, 1.2) : 0);
                }
            }

            if (enemy.state !== 'attack') {
                if (!isRanged) {
                    enemy.attackCooldown = Math.max(0, enemy.attackCooldown - dt);
                }
                if (enemy.attackCooldown <= 0 && enemy.state === 'idle' && distToPlayer < enemy.attackRange * 1.5 && !isRanged) {
                    enemy.state = 'attack';
                    enemy.attackTimer = enemy.attackDelay * rand(0.7, 1.3);
                }
            }

            // 独立远程攻击
            if (isRanged && !enemy.isDead && !enemy.dying && !enemy.isParried) {
                if (distToPlayer <= enemy.attackRange && enemy.attackCooldown <= 0 && Math.random() < 0.7) {
                    const ang = angle(enemy, player);
                    const proj = {
                        x: enemy.x + Math.cos(ang) * enemy.radius,
                        y: enemy.y + Math.sin(ang) * enemy.radius,
                        vx: Math.cos(ang) * (enemy.projectileSpeed || 3.5),
                        vy: Math.sin(ang) * (enemy.projectileSpeed || 3.5),
                        radius: 8,
                        damage: enemy.projectileDamage || enemy.attack,
                        life: 3,
                        owner: 'enemy',
                        attacker: enemy,
                        trail: [],
                        color: '#88dd44'
                    };
                    projectiles.push(proj);
                    enemy.attackCooldown = enemy.maxAttackCooldown * rand(0.55, 1.45) + (Math.random() < 0.2 ? rand(0.3, 0.8) : 0);
                    spawnParticles(enemy.x, enemy.y, '#88dd44', 6, 3);
                }
                enemy.attackCooldown = Math.max(0, enemy.attackCooldown - dt);
            }

            if (enemy.attackAnim > 0) enemy.attackAnim -= dt * 2;
            if (enemy.attackAnim < 0) enemy.attackAnim = 0;
            enemy.x = clamp(enemy.x, -20, W + 20);
            enemy.y = clamp(enemy.y, -20, H + 20);
            enemy.attackEffect = Math.max(0, enemy.attackEffect - dt);
            if (enemy.state === 'chase') {
                enemy.walkCycle += dt;
            }
            if (enemy.armSwing > 0) {
                enemy.armSwing -= dt * 3;
                if (enemy.armSwing < 0) enemy.armSwing = 0;
            }
        }

        // ---------- 粒子系统 ----------
        function spawnParticles(x, y, color, count, speed) {
            for (let i = 0; i < count; i++) {
                const ang = rand(0, Math.PI * 2);
                const spd = rand(0.5, speed || 3);
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    life: rand(0.3, 0.8),
                    maxLife: 0.8,
                    radius: rand(2, 5),
                    color: color,
                    decay: rand(0.95, 0.99)
                });
            }
        }

        function addDamageNumber(x, y, text, color) {
            damageNumbers.push({
                x: x,
                y: y,
                text: String(text),
                color: color,
                life: 0.8,
                maxLife: 0.8,
                vy: -1.5
            });
        }

        // 优化文字提示，增加随机偏移避免重叠
        function addFloatingText(x, y, text, color, size, duration) {
            const offsetX = rand(-25, 25);
            const offsetY = rand(-15, 15);
            floatingTexts.push({
                x: x + offsetX,
                y: y + offsetY,
                text: text,
                color: color,
                size: size || 20,
                life: duration || 40,
                maxLife: duration || 40,
                vy: -0.5
            });
        }

        // ---------- 游戏结束 ----------
        function gameOver(victory) {
            state = GameState.GAMEOVER;
            showOverlay('败北', '你倒在了黑暗中... 等级 ' + player.level + ' | 击杀 ' + player.kills, false);
        }

        function showOverlay(title, subtitle, victory) {
            overlayTitle.textContent = title;
            overlayTitle.style.color = victory ? '#ffd700' : '#e74c3c';
            overlaySub.textContent = subtitle;
            overlay.classList.add('show');
            if (victory) {
                overlayTitle.textContent = '🏆 ' + title;
            }
        }

        // ---------- 更新 ----------
        function update(dt) {
            if (state === GameState.GAMEOVER || state === GameState.VICTORY) return;
            if (state === GameState.PLAYING) {
                gameTime += dt;
                updatePlayer(dt);
                updateEnemies(dt);
                updateProjectiles(dt);
                updateParticles(dt);
                updateDamageNumbers(dt);
                updateFloatingTexts(dt);
                updateBuffs(dt);
                updateSkillEffects(dt);
                if (isWaveActive && enemies.filter(e => !e.isDead && !e.dying).length < 6) {
                    spawnEnemiesFromQueue(1);
                }
                if (!isWaveActive && !bossActive) {
                    const alive = enemies.filter(e => !e.isDead && !e.dying);
                    if (alive.length === 0 && !levelComplete) {
                        levelComplete = true;
                        levelTransition = 60;
                    }
                }
                if (levelComplete) {
                    levelTransition -= dt * 60;
                    if (levelTransition <= 0) {
                        levelComplete = false;
                        const nextLevel = currentLevel + 1;
                        if (nextLevel >= LEVELS.length) {
                            if (!bossDefeated) {} else {
                                state = GameState.VICTORY;
                                showOverlay('胜利', '你击败了所有敌人，成为了新的暗魂之主！', true);
                            }
                        } else {
                            startLevel(nextLevel);
                            player.hp = Math.min(player.hp + 30, player.maxHp);
                            player.stamina = Math.min(player.stamina + 30, player.maxStamina);
                        }
                    }
                }
                screenShake *= 0.92;
                if (screenShake < 0.05) screenShake = 0;
                timeScale += (1 - timeScale) * dt * 5;
                if (Math.abs(timeScale - 1) < 0.01) timeScale = 1;
                if (screenFlash.life > 0) {
                    screenFlash.life -= dt;
                    screenFlash.a = Math.max(0, screenFlash.life / 0.4);
                }
                player.trail = player.trail.filter(t => {
                    t.life -= dt;
                    return t.life > 0;
                });
                if (player.attackAnim > 0) player.attackAnim -= dt * 4;
                if (player.attackAnim < 0) player.attackAnim = 0;
                if ((keys['w'] || keys['a'] || keys['s'] || keys['d']) && !player.isDodging && !player.isBlocking) {
                    player.walkCycle += dt;
                }
                if (player.armSwing < 0) {
                    player.armSwing += dt * 4;
                    if (player.armSwing >= 0) player.armSwing = 0;
                } else if (player.armSwing > 0) {
                    player.armSwing -= dt * 3;
                    if (player.armSwing < 0) player.armSwing = 0;
                }
                if (player.killInvincible > 0) {
                    player.killInvincible -= dt;
                    if (player.killInvincible < 0) player.killInvincible = 0;
                    if (player.killInvincible > 0 && Math.random() < 0.3) {
                        const ang = rand(0, Math.PI * 2);
                        const dist2 = player.radius + 6 + rand(0, 6);
                        particles.push({
                            x: player.x + Math.cos(ang) * dist2,
                            y: player.y + Math.sin(ang) * dist2,
                            vx: Math.cos(ang) * rand(0.2, 0.8),
                            vy: Math.sin(ang) * rand(0.2, 0.8),
                            life: rand(0.2, 0.4),
                            maxLife: 0.4,
                            radius: rand(2, 4),
                            color: '#ffd700',
                            decay: 0.95
                        });
                    }
                }
                if (player.isExecuting) {
                    player.executeTimer -= dt;
                    if (player.executeTimer <= 0) {
                        player.isExecuting = false;
                    }
                }
            }
        }

        function updatePlayer(dt) {
            if (!player.isBlocking && !player.isDodging) {
                player.stamina = Math.min(player.maxStamina, player.stamina + player.staminaRegen * dt * 60);
            }
            player.attackCooldown = Math.max(0, player.attackCooldown - dt);
            player.dodgeCooldown = Math.max(0, player.dodgeCooldown - dt);
            player.invincible = Math.max(0, player.invincible - dt);
            player.hitCooldown = Math.max(0, player.hitCooldown - dt);
            player.hitFlash = Math.max(0, player.hitFlash - dt);
            player.comboTime = Math.max(0, player.comboTime - dt);
            if (player.comboTime <= 0) player.combo = 0;

            for (const key in player.skills) {
                player.skills[key].cooldown = Math.max(0, player.skills[key].cooldown - dt);
            }

            if ((keys['l'] || keys['space']) && !player.isDodging && player.dodgeCooldown <= 0 && !player.isExecuting) {
                player.isDodging = true;
                player.dodgeTimer = player.dodgeDuration;
                player.dodgeCooldown = 0.1;
                player.invincible = player.dodgeDuration + 0.05;
                playSound('dodge');
                spawnParticles(player.x, player.y, '#88ddff', 10, 4);
            }
            if (player.isDodging) {
                player.dodgeTimer -= dt;
                let dx = 0,
                    dy = 0;
                if (keys['w']) dy = -1;
                if (keys['s']) dy = 1;
                if (keys['a']) dx = -1;
                if (keys['d']) dx = 1;
                if (dx !== 0 || dy !== 0) {
                    const len = Math.sqrt(dx * dx + dy * dy);
                    dx /= len;
                    dy /= len;
                    player.facing = Math.atan2(dy, dx);
                }
                player.x += dx * player.dodgeSpeed * dt * 60;
                player.y += dy * player.dodgeSpeed * dt * 60;
                if (player.dodgeTimer <= 0) {
                    player.isDodging = false;
                }
            } else {
                let dx = 0,
                    dy = 0;
                if (keys['w']) dy = -1;
                if (keys['s']) dy = 1;
                if (keys['a']) dx = -1;
                if (keys['d']) dx = 1;
                if (dx !== 0 || dy !== 0) {
                    const len = Math.sqrt(dx * dx + dy * dy);
                    dx /= len;
                    dy /= len;
                    player.facing = Math.atan2(dy, dx);
                    const speed = player.speed * (player.isBlocking ? 0.4 : 1);
                    player.x += dx * speed * dt * 60;
                    player.y += dy * speed * dt * 60;
                }
                if (player.blockRecovery > 0) player.blockRecovery -= dt;
                if (keys['k'] && !player.isAttacking && !player.isDodging && !player.isExecuting && player.blockRecovery <= 0) {
                    if (!player.isBlocking && player.blockStartup <= 0) {
                        player.blockTimer = 0;
                        player.blockStartup = 0.08;
                    }
                    if (player.blockStartup > 0) {
                        player.blockStartup -= dt;
                        if (player.blockStartup <= 0) {
                            player.blockStartup = 0;
                            player.isBlocking = true;
                            player.blockTimer = 0;
                        }
                    } else {
                        player.isBlocking = true;
                        player.blockTimer += dt;
                    }
                } else if (player.isBlocking) {
                    player.isBlocking = false;
                    player.blockRecovery = 0.1;
                }
            }

            if (keys['j'] && !player.isAttacking && !player.isDodging && !player.isExecuting) {
                playerAttack();
            }
            if (player.isAttacking) {
                player.attackDuration -= dt;
                if (player.attackDuration <= 0) {
                    player.isAttacking = false;
                }
            }

            if (keys['q']) { useSkill('q');
                keys['q'] = false; }
            if (keys['e']) { useSkill('e');
                keys['e'] = false; }

            for (let i = 1; i <= 4; i++) {
                if (keys[String(i)]) {
                    useItem(i);
                    keys[String(i)] = false;
                }
            }

            if (keys['c']) {
                player.skinIndex = (player.skinIndex + 1) % SKINS.length;
                keys['c'] = false;
                addFloatingText(player.x, player.y - 40, '皮肤: ' + SKINS[player.skinIndex].name, '#aaa', 18, 30);
            }

            player.x = clamp(player.x, player.radius, W - player.radius);
            player.y = clamp(player.y, player.radius, H - player.radius);
        }

        function updateEnemies(dt) {
            for (const enemy of enemies) {
                if (enemy.dying) {
                    enemy.deathTimer -= dt;
                    if (enemy.deathTimer <= 0) {
                        enemy.isDead = true;
                        enemy.dying = false;
                    }
                    continue;
                }
                updateEnemyAI(enemy, dt);
                for (const other of enemies) {
                    if (other === enemy || other.isDead || other.dying) continue;
                    const d = dist(enemy, other);
                    const minD = enemy.radius + other.radius;
                    if (d < minD && d > 0.01) {
                        const ang = angle(enemy, other);
                        const push = (minD - d) * 0.3;
                        enemy.x -= Math.cos(ang) * push;
                        enemy.y -= Math.sin(ang) * push;
                    }
                }
            }
            enemies = enemies.filter(e => !e.isDead || e.dying);
        }

        function updateProjectiles(dt) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += p.vx * dt * 60;
                p.y += p.vy * dt * 60;
                p.life -= dt;
                if (p.trail) {
                    p.trail.push({ x: p.x, y: p.y, life: 0.3 });
                    p.trail = p.trail.filter(t => t.life > 0);
                    for (const t of p.trail) t.life -= dt;
                }
                if (p.maxRadius) {
                    p.radius += (p.maxRadius - p.radius) * 0.05;
                }
                if (p.life <= 0 || p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
                    projectiles.splice(i, 1);
                    continue;
                }
                if (p.owner === 'player') {
                    for (const enemy of enemies) {
                        if (enemy.isDead || enemy.dying) continue;
                        if (enemy.isParried) continue;
                        if (dist(p, enemy) < p.radius + enemy.radius) {
                            const dmg = Math.round(Math.max(1, p.damage - enemy.defense + rand(-2, 2)));
                            damageEnemy(enemy, dmg);
                            spawnParticles(p.x, p.y, '#66ccff', 12, 5);
                            screenShake = Math.max(screenShake, 4);
                            projectiles.splice(i, 1);
                            break;
                        }
                    }
                } else if (p.owner === 'enemy') {
                    if (dist(p, player) < p.radius + player.radius) {
                        damagePlayer(p.damage, p.attacker || null);
                        spawnParticles(p.x, p.y, '#aa44ff', 12, 5);
                        screenShake = Math.max(screenShake, 4);
                        projectiles.splice(i, 1);
                        continue;
                    }
                }
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt * 60;
                p.y += p.vy * dt * 60;
                p.vx *= p.decay || 0.97;
                p.vy *= p.decay || 0.97;
                p.life -= dt;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function updateDamageNumbers(dt) {
            for (let i = damageNumbers.length - 1; i >= 0; i--) {
                const d = damageNumbers[i];
                d.y += d.vy * dt * 60;
                d.life -= dt;
                if (d.life <= 0) {
                    damageNumbers.splice(i, 1);
                }
            }
        }

        function updateFloatingTexts(dt) {
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const f = floatingTexts[i];
                f.y += f.vy * dt * 60;
                f.life -= dt * 60;
                if (f.life <= 0) {
                    floatingTexts.splice(i, 1);
                }
            }
        }

        function updateBuffs(dt) {
            for (const key in player.activeBuffs) {
                const buff = player.activeBuffs[key];
                buff.timer = (buff.timer || 0) + dt;
                if (buff.timer >= buff.duration) {
                    delete player.activeBuffs[key];
                    addFloatingText(player.x, player.y - 30, '⏳ ' + key + ' 效果消失', '#aaa', 14, 30);
                }
            }
        }

        function updateSkillEffects(dt) {
            for (let i = skillEffects.length - 1; i >= 0; i--) {
                const e = skillEffects[i];
                e.life -= dt;
                if (e.life <= 0) {
                    skillEffects.splice(i, 1);
                    continue;
                }
                if (e.type === 'e_blade') {
                    e.angle += dt * 25;
                }
                if (e.type === 'e_vortex') {
                    e.angle += dt * 20;
                }
                if (e.type === 'q_wave') {
                    e.radius += dt * 400;
                }
                if (e.type === 'e_shockwave') {
                    e.radius += dt * 350;
                }
            }
        }

        // ---------- 渲染 ----------
        function drawDodgeAfterimage(ctx, p, facing, walkBob, torsoW, skin, limbColor, headColor, flash) {
            const torsoH = 16;
            const headR = 9;
            const headY = -(torsoH / 2 + headR - 1);
            const legLen = 10;
            const legW = 4;

            // 腿
            const legSpread = 5;
            for (let side = -1; side <= 1; side += 2) {
                const la = side === -1 ? facing - 0.3 : facing + 0.3;
                const lx = Math.cos(la) * legSpread;
                const ly = Math.sin(la) * legSpread + 7;
                ctx.save();
                ctx.translate(lx, ly);
                ctx.rotate(la + Math.PI / 2);
                ctx.fillStyle = '#88ddff';
                ctx.beginPath();
                ctx.roundRect(-legW/2, 0, legW, legLen, 2);
                ctx.fill();
                ctx.restore();
            }

            // 躯干
            ctx.fillStyle = '#88ddff';
            ctx.beginPath();
            ctx.roundRect(-torsoW/2, -2, torsoW, torsoH, 4);
            ctx.fill();

            // 头
            ctx.beginPath();
            ctx.arc(0, headY, headR, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw() {
            ctx.save();

            if (screenShake > 0.1) {
                const intensity = screenShake * 0.8;
                ctx.translate(
                    (Math.random() - 0.5) * intensity * 2,
                    (Math.random() - 0.5) * intensity * 2
                );
            }

            const grad = ctx.createRadialGradient(500, 300, 100, 500, 300, 600);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#0a0a12');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 60) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = 0; y < H; y += 60) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            // 全屏闪光效果
            if (screenFlash.life > 0 && screenFlash.a > 0) {
                ctx.globalAlpha = screenFlash.a;
                ctx.fillStyle = `rgb(${screenFlash.r},${screenFlash.g},${screenFlash.b})`;
                ctx.fillRect(0, 0, W, H);
                ctx.globalAlpha = 1;
            }

            if (currentLevel < LEVELS.length) {
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.font = '14px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(LEVELS[currentLevel].name, W / 2, 28);
            }

            // 投射物
            for (const p of projectiles) {
                if (p.trail) {
                    for (const t of p.trail) {
                        ctx.globalAlpha = t.life / 0.3 * 0.4;
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, p.radius * 0.4, 0, Math.PI * 2);
                        ctx.fillStyle = p.color || '#66ccff';
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }
                const grad2 = ctx.createRadialGradient(p.x - 3, p.y - 3, 2, p.x, p.y, p.radius);
                if (p.owner === 'player') {
                    grad2.addColorStop(0, '#88ddff');
                    grad2.addColorStop(1, '#2266aa');
                } else {
                    grad2.addColorStop(0, '#ff66aa');
                    grad2.addColorStop(1, '#aa2266');
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad2;
                ctx.fill();
                ctx.shadowColor = p.owner === 'player' ? '#44aaff' : '#ff44aa';
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0;
                if (p.maxRadius) {
                    ctx.strokeStyle = 'rgba(170,68,255,0.3)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // 敌人
            for (const enemy of enemies) {
                if (enemy.isDead && !enemy.dying) continue;
                const isBoss = enemy.isBoss || false;
                const isMiniBoss = enemy.isMiniBoss || false;
                const r = enemy.radius;
                const flash = enemy.hitFlash > 0;

                let scale = 1;
                let alpha = 1;
                if (enemy.dying) {
                    const progress = 1 - (enemy.deathTimer / 0.8);
                    scale = 1 - progress * 0.8;
                    alpha = 1 - progress;
                    if (alpha < 0) alpha = 0;
                }

                ctx.save();
                ctx.translate(enemy.x, enemy.y);
                ctx.globalAlpha = alpha;
                ctx.scale(scale, scale);

                if (enemy.isParried && !enemy.dying) {
                    ctx.strokeStyle = `rgba(255, 0, 0, ${0.5 + 0.5 * Math.sin(gameTime * 12)})`;
                    ctx.lineWidth = 4;
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    ctx.arc(0, 2, r + 8 + 2 * Math.sin(gameTime * 8), 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ff4444';
                    ctx.font = 'bold 18px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('⚠', 0, -r - 18);
                }

                if (enemy.attackEffectActive && !enemy.dying && !enemy.isParried) {
                    const progress = 1 - (enemy.attackEffectTimer / 0.3);
                    const arcSize = 0.8 + progress * 0.4;
                    const alphaEffect = 0.6 * (1 - progress);
                    ctx.globalAlpha = alphaEffect;
                    ctx.strokeStyle = enemy.effectColor || '#ff8844';
                    ctx.lineWidth = 6 + progress * 4;
                    ctx.shadowColor = enemy.effectColor || '#ff8844';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    const a1 = enemy.facing - 0.7 * arcSize;
                    const a2 = enemy.facing + 0.7 * arcSize;
                    ctx.arc(0, 2, r * 1.8, a1, a2);
                    ctx.stroke();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(0, 2, r * 1.6, a1 + 0.2, a2 - 0.2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }

                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 4;

                const color = flash ? '#ffffff' : enemy.color;
                const facing = enemy.facing || 0;
                const isRanged = enemy.isRanged || false;

                let headColor, limbColor, swordColor, hairColor;
                if (isBoss && !isMiniBoss) {
                    headColor = flash ? '#fff' : '#7a2244';
                    limbColor = flash ? '#fff' : '#5a1a33';
                    swordColor = flash ? '#ddd' : '#cc6688';
                    hairColor = flash ? '#aaa' : '#1a0a12';
                } else if (isMiniBoss) {
                    headColor = flash ? '#fff' : '#9a5577';
                    limbColor = flash ? '#fff' : '#7a3355';
                    swordColor = flash ? '#ddd' : '#aa7799';
                    hairColor = flash ? '#aaa' : '#2a1522';
                } else if (isRanged) {
                    headColor = flash ? '#fff' : lightenColor(color, 15);
                    limbColor = flash ? '#fff' : color;
                    swordColor = flash ? '#ddd' : '#8B7D5B';
                    hairColor = flash ? '#aaa' : '#2a3020';
                } else {
                    headColor = flash ? '#fff' : lightenColor(color, 15);
                    limbColor = flash ? '#fff' : color;
                    swordColor = flash ? '#ddd' : '#8a7a6a';
                    hairColor = flash ? '#aaa' : '#1a1a1a';
                }

                const torsoW = isBoss ? 18 : isMiniBoss ? 16 : isRanged ? 10 : 12;
                const torsoH = isBoss ? 20 : isMiniBoss ? 18 : isRanged ? 13 : 15;
                const headR = isBoss ? 11 : isMiniBoss ? 10 : isRanged ? 7 : 8;
                const headY = -(torsoH / 2 + headR - 1);
                const legLen = isBoss ? 12 : isMiniBoss ? 11 : isRanged ? 8 : 10;
                const legW = isBoss ? 5 : isMiniBoss ? 4.5 : isRanged ? 3 : 3.5;

                const isWalking = enemy.state === 'chase' || (enemy.state === 'idle' && dist(enemy, {x: enemy.homeX, y: enemy.homeY}) > 10);
                const walkSpeed = isWalking ? 7 : 0;
                const walkPhase = Math.sin(enemy.walkCycle * walkSpeed);
                const walkBob = isWalking ? Math.abs(Math.sin(enemy.walkCycle * walkSpeed * 2)) * 1.5 : 0;
                const walkStride = isWalking ? walkPhase * 0.5 : 0;

                // --- 腿（带膝盖弯曲） ---
                const legSpread = torsoW * 0.35;
                const thighLen = legLen * 0.5;
                const shinLen = legLen * 0.5;
                for (let side = -1; side <= 1; side += 2) {
                    const la = side === -1 ? facing - 0.45 + walkStride : facing + 0.45 - walkStride;
                    const lx = Math.cos(la) * legSpread;
                    const ly = Math.sin(la) * legSpread + torsoH / 2 + 1 - walkBob;
                    const kneeAngle = isWalking ? (side === -1 ? Math.max(0, walkPhase) * 0.4 : Math.max(0, -walkPhase) * 0.4) : 0;
                    const footLift = isWalking ? Math.max(0, (side === -1 ? -walkPhase : walkPhase)) * 2 : 0;

                    ctx.save();
                    ctx.translate(lx, ly - footLift);
                    ctx.rotate(la + Math.PI / 2);
                    const legGrad = ctx.createLinearGradient(-legW/2, 0, legW/2, 0);
                    legGrad.addColorStop(0, lightenColor(limbColor, -20));
                    legGrad.addColorStop(0.5, limbColor);
                    legGrad.addColorStop(1, lightenColor(limbColor, -20));
                    // 大腿
                    ctx.fillStyle = legGrad;
                    ctx.beginPath();
                    ctx.roundRect(-legW/2, 0, legW, thighLen, 2);
                    ctx.fill();
                    // 膝盖
                    ctx.fillStyle = lightenColor(limbColor, -10);
                    ctx.beginPath();
                    ctx.arc(0, thighLen, legW / 2 + 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    // 小腿（弯曲）
                    ctx.save();
                    ctx.translate(0, thighLen);
                    ctx.rotate(kneeAngle);
                    ctx.fillStyle = legGrad;
                    ctx.beginPath();
                    ctx.roundRect(-legW/2, 0, legW, shinLen, 2);
                    ctx.fill();
                    // 靴子
                    ctx.fillStyle = swordColor;
                    ctx.beginPath();
                    ctx.roundRect(-legW/2 - 1, shinLen - 2, legW + 2, 3, 1);
                    ctx.fill();
                    ctx.restore();

                    ctx.restore();
                }

                // --- 躯干（带走路微倾） ---
                const enemyWalkLean = isWalking ? Math.sin(enemy.walkCycle * 7) * 0.04 : 0;
                ctx.save();
                ctx.rotate(enemyWalkLean);
                const grad3 = ctx.createRadialGradient(-torsoW * 0.15, -torsoH * 0.15 - walkBob, 2, 0, torsoH * 0.1 - walkBob, torsoW * 0.8);
                if (flash) {
                    grad3.addColorStop(0, '#ffffff');
                    grad3.addColorStop(1, '#dddddd');
                } else if (isBoss && !isMiniBoss) {
                    grad3.addColorStop(0, '#bb5588');
                    grad3.addColorStop(1, '#441122');
                } else if (isMiniBoss) {
                    grad3.addColorStop(0, '#cc88aa');
                    grad3.addColorStop(1, '#662244');
                } else {
                    grad3.addColorStop(0, lightenColor(color, 30));
                    grad3.addColorStop(1, color);
                }
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.roundRect(-torsoW/2, -torsoH/2 - walkBob, torsoW, torsoH, isBoss ? 5 : 3);
                ctx.fill();

                // 腰带
                ctx.fillStyle = swordColor;
                ctx.fillRect(-torsoW/2 + 1, torsoH/2 - 3 - walkBob, torsoW - 2, 3);

                // 肩甲（走路时微动）
                const enemyShoulderBob = isWalking ? Math.sin(enemy.walkCycle * 7) * 0.06 : 0;
                ctx.fillStyle = lightenColor(swordColor, 10);
                for (let side = -1; side <= 1; side += 2) {
                    const sx = side * (torsoW/2 - 1);
                    ctx.beginPath();
                    ctx.ellipse(sx, -torsoH/2 + 2 - walkBob + side * enemyShoulderBob * 3, isBoss ? 5 : 3.5, isBoss ? 3.5 : 2.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // --- 头 ---
                const headYBob = headY - walkBob;
                const headGrad = ctx.createRadialGradient(-headR * 0.2, headYBob - headR * 0.2, 2, 0, headYBob, headR);
                if (flash) {
                    headGrad.addColorStop(0, '#ffffff');
                    headGrad.addColorStop(1, '#dddddd');
                } else {
                    headGrad.addColorStop(0, lightenColor(headColor, 25));
                    headGrad.addColorStop(1, headColor);
                }
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.arc(0, headYBob, headR, 0, Math.PI * 2);
                ctx.fill();

                // 头发/兜帽
                ctx.fillStyle = hairColor;
                ctx.beginPath();
                ctx.arc(0, headYBob - 1, headR + 1, Math.PI + 0.3, -0.3);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(0, headYBob, headR - 1, Math.PI + 0.5, -0.5);
                ctx.fill();

                // Boss 头冠
                if (isBoss && !isMiniBoss) {
                    ctx.fillStyle = '#ffd700';
                    ctx.font = isMiniBoss ? '16px sans-serif' : '18px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('👑', 0, headYBob - headR - 10);
                }
                if (isMiniBoss) {
                    ctx.fillStyle = '#ffd700';
                    ctx.font = '16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⭐', 0, headYBob - headR - 8);
                }

                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // Boss 光环
                if (isBoss) {
                    ctx.shadowColor = isMiniBoss ? '#aa5588' : '#aa3355';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(0, 2, r * 1.1, 0, Math.PI * 2);
                    ctx.strokeStyle = isMiniBoss ? 'rgba(170,80,130,0.3)' : 'rgba(170,50,80,0.3)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // --- 眼睛 ---
                const eyeOff = headR * 0.38;
                const eyeR2 = isBoss ? 4 : isMiniBoss ? 3.5 : 2.5;
                ctx.fillStyle = flash ? '#555' : '#ff3333';
                for (let side = -1; side <= 1; side += 2) {
                    const ex = Math.cos(facing + side * 0.28) * eyeOff;
                    const ey = Math.sin(facing + side * 0.28) * eyeOff + headYBob;
                    ctx.beginPath();
                    ctx.ellipse(ex, ey, eyeR2, eyeR2 * 0.8, facing, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#111';
                    const px = Math.cos(facing) * 1.5;
                    const py = Math.sin(facing) * 1.5;
                    ctx.beginPath();
                    ctx.arc(ex + px, ey + py, eyeR2 * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = flash ? '#555' : '#ff3333';
                }

                // --- 手臂 + 武器 ---
                const armSwingAngle = (function() {
                    if (enemy.armSwing > 0.5) return (enemy.armSwing - 0.5) * 4.5;
                    if (enemy.armSwing > 0) return enemy.armSwing * 1.5;
                    return isWalking ? walkPhase * 0.3 : 0;
                })();
                const handX = torsoW / 2 + 10;
                const handY = 1;
                const armW = isBoss ? 5.5 : isMiniBoss ? 5 : isRanged ? 3.5 : 4;

                // 右臂（带走路摆动+手肘弯曲）
                ctx.save();
                ctx.translate(0, -walkBob);
                ctx.rotate(armSwingAngle);
                const enemyElbowBend = isWalking ? 0.25 + Math.abs(walkPhase) * 0.15 : 0.1;
                ctx.strokeStyle = limbColor;
                ctx.lineWidth = armW;
                ctx.lineCap = 'round';
                // 上臂
                ctx.beginPath();
                ctx.moveTo(torsoW/2 - 2, 2);
                const eElbowX = torsoW/2 + 4;
                const eElbowY = 0;
                ctx.lineTo(eElbowX, eElbowY);
                ctx.stroke();
                // 前臂
                ctx.save();
                ctx.translate(eElbowX, eElbowY);
                ctx.rotate(enemyElbowBend);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(6, 1);
                ctx.stroke();
                ctx.fillStyle = flash ? '#fff' : lightenColor(headColor, 10);
                ctx.beginPath();
                ctx.arc(6, 1, isBoss ? 3.5 : 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // --- 左臂（反向摆动+手肘弯曲） ---
                const leftSwing = isWalking ? -walkPhase * 0.3 : 0;
                ctx.rotate(-armSwingAngle);
                ctx.rotate(leftSwing);
                ctx.strokeStyle = limbColor;
                ctx.lineWidth = isBoss ? 5 : isMiniBoss ? 4.5 : isRanged ? 3 : 3.5;
                ctx.lineCap = 'round';
                const eLeftElbow = isWalking ? 0.2 + Math.abs(walkPhase) * 0.15 : 0.1;
                ctx.beginPath();
                ctx.moveTo(-torsoW/2 + 2, 2);
                const eLeftElbowX = -torsoW/2 - 3;
                const eLeftElbowY = 5;
                ctx.lineTo(eLeftElbowX, eLeftElbowY);
                ctx.stroke();
                ctx.save();
                ctx.translate(eLeftElbowX, eLeftElbowY);
                ctx.rotate(-eLeftElbow);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, 5);
                ctx.stroke();
                ctx.fillStyle = flash ? '#fff' : lightenColor(headColor, 10);
                ctx.beginPath();
                ctx.arc(0, 5, isBoss ? 3 : 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.restore();

                // --- 武器（与手臂共用动画变换） ---
                if (!enemy.isParried && enemy.weaponVisible && !enemy.dying) {
                    ctx.save();
                    ctx.translate(0, -walkBob);
                    ctx.rotate(armSwingAngle);
                    if (isRanged) {
                        // ---- 弓 ----
                        const bowH = isBoss ? 28 : 22;
                        const bowW = isBoss ? 14 : 10;
                        const bowColor = swordColor;

                        ctx.save();
                        ctx.translate(handX, handY);
                        ctx.rotate(facing);

                        // 弓臂（弧线，朝朝向外侧弯曲）
                        ctx.strokeStyle = bowColor;
                        ctx.lineWidth = isBoss ? 3 : 2.5;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(0, -bowH/2);
                        ctx.quadraticCurveTo(bowW, 0, 0, bowH/2);
                        ctx.stroke();

                        // 弓弦（在弓的内侧）
                        ctx.strokeStyle = '#c0b0a0';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(0, -bowH/2);
                        ctx.lineTo(-2, 0);
                        ctx.lineTo(0, bowH/2);
                        ctx.stroke();

                        // 箭（搭在弦上）
                        if (enemy.state === 'attack' || enemy.attackCooldown > enemy.maxAttackCooldown * 0.5) {
                            const arrowLen = isBoss ? 30 : 24;
                            ctx.strokeStyle = '#8a7a6a';
                            ctx.lineWidth = 1.5;
                            ctx.beginPath();
                            ctx.moveTo(-6, 0);
                            ctx.lineTo(arrowLen - 6, 0);
                            ctx.stroke();
                            ctx.fillStyle = '#c0b0a0';
                            ctx.beginPath();
                            ctx.moveTo(arrowLen - 4, 0);
                            ctx.lineTo(arrowLen - 9, -2.5);
                            ctx.lineTo(arrowLen - 9, 2.5);
                            ctx.closePath();
                            ctx.fill();
                            ctx.strokeStyle = '#8a6a5a';
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(-6, 0);
                            ctx.lineTo(-10, -3);
                            ctx.moveTo(-6, 0);
                            ctx.lineTo(-10, 3);
                            ctx.stroke();
                        }

                        ctx.restore();
                    } else {
                        // ---- 近战剑 ----
                        const swordLen = isBoss ? 38 : isMiniBoss ? 34 : isRanged ? 24 : 28;
                        const gripLen = isBoss ? 12 : 10;
                        const gx = handX + gripLen;

                        ctx.save();
                        ctx.translate(handX, handY);
                        ctx.rotate(facing - Math.atan2(handY, handX) + armSwingAngle);

                        // 剑柄
                        ctx.fillStyle = '#3a2210';
                        ctx.fillRect(0, -2, gripLen, 4);
                        ctx.strokeStyle = '#5a3a1a';
                        ctx.lineWidth = 0.6;
                        for (let i = 0; i < 4; i++) {
                            ctx.beginPath();
                            ctx.moveTo(1 + i * 2.5, -2);
                            ctx.lineTo(2 + i * 2.5, 2);
                            ctx.stroke();
                        }

                        // 剑首
                        ctx.fillStyle = lightenColor(swordColor, -10);
                        ctx.beginPath();
                        ctx.arc(-1, 0, isBoss ? 4 : 3.5, 0, Math.PI * 2);
                        ctx.fill();

                        // 护手
                        ctx.fillStyle = swordColor;
                        ctx.beginPath();
                        ctx.roundRect(gripLen - 1, -5, 3, 10, 1.5);
                        ctx.fill();

                        // 剑刃
                        const bladeStartX = gripLen + 2;
                        const bladeEndX = bladeStartX + swordLen;
                        const gradSword = ctx.createLinearGradient(bladeStartX, 0, bladeEndX, 0);
                        gradSword.addColorStop(0, lightenColor(swordColor, 20));
                        gradSword.addColorStop(0.5, swordColor);
                        gradSword.addColorStop(1, lightenColor(swordColor, -30));
                        ctx.fillStyle = gradSword;
                        ctx.beginPath();
                        ctx.moveTo(bladeStartX, -2.5);
                        ctx.lineTo(bladeEndX - 3, -1.5);
                        ctx.lineTo(bladeEndX, 0);
                        ctx.lineTo(bladeEndX - 3, 1.5);
                        ctx.lineTo(bladeStartX, 2.5);
                        ctx.closePath();
                        ctx.fill();

                        // 剑脊
                        ctx.strokeStyle = lightenColor(swordColor, 40);
                        ctx.lineWidth = 0.7;
                        ctx.globalAlpha = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(bladeStartX + 2, 0);
                        ctx.lineTo(bladeEndX - 5, 0);
                        ctx.stroke();
                        ctx.globalAlpha = 1;

                        ctx.restore();
                    }
                    ctx.restore();
                } else if (enemy.isParried && !enemy.dying) {
                    // 掉落的武器
                    ctx.fillStyle = '#c0b0a0';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(isRanged ? '🏹' : '🗡', 0, r + 6);
                }

                ctx.restore(); // enemy walk lean

                // --- HP条 ---
                if (!enemy.dying && !enemy.isParried) {
                    ctx.shadowBlur = 0;
                    const barW = r * 2.2;
                    const barH = 4;
                    const barY = -r - 10;
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(-barW / 2, barY, barW, barH);
                    const hpRatio = Math.max(0, enemy.hp / enemy.maxHp);
                    const hpColor = hpRatio > 0.6 ? '#44dd44' : hpRatio > 0.3 ? '#dddd44' : '#dd4444';
                    ctx.fillStyle = hpColor;
                    ctx.fillRect(-barW / 2, barY, barW * hpRatio, barH);
                    if (isBoss) {
                        ctx.fillStyle = 'rgba(0,0,0,0.5)';
                        ctx.fillRect(-barW / 2 - 2, barY - 2, barW + 4, barH + 4);
                        ctx.fillStyle = hpColor;
                        ctx.fillRect(-barW / 2, barY, barW * hpRatio, barH);
                        ctx.fillStyle = isMiniBoss ? '#ffaa88' : '#ff6b6b';
                        ctx.font = isMiniBoss ? 'bold 11px sans-serif' : 'bold 12px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText(isMiniBoss ? '小Boss' : '深渊之主', 0, barY - 4);

                        // 破防条（需要完美格挡次数）
                        if (enemy.maxParryCount > 0) {
                            const parryBarY = barY + barH + 4;
                            const parryBarH = 3;
                            const parryRatio = Math.max(0, 1 - enemy.parryCount / enemy.maxParryCount);
                            ctx.fillStyle = 'rgba(0,0,0,0.6)';
                            ctx.fillRect(-barW / 2, parryBarY, barW, parryBarH);
                            const parryColor = parryRatio >= 1 ? '#ffdd44' : '#44aaff';
                            ctx.fillStyle = parryColor;
                            ctx.fillRect(-barW / 2, parryBarY, barW * parryRatio, parryBarH);
                            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                            ctx.lineWidth = 0.5;
                            ctx.strokeRect(-barW / 2, parryBarY, barW, parryBarH);
                            // 格挡次数文字
                            ctx.fillStyle = parryRatio >= 1 ? '#ffdd44' : '#88bbff';
                            ctx.font = '9px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'top';
                            ctx.fillText('格挡 ' + enemy.parryCount + '/' + enemy.maxParryCount, 0, parryBarY + parryBarH + 2);
                        }
                    }
                }

                ctx.restore();
                ctx.globalAlpha = 1;
            }

            // 玩家
            ctx.save();
            ctx.translate(player.x, player.y);

            if (player.killInvincible > 0) {
                const pulse = 1 + Math.sin(gameTime * 20) * 0.05;
                ctx.strokeStyle = `rgba(255, 215, 0, ${0.4 + 0.3 * Math.sin(gameTime * 10)})`;
                ctx.lineWidth = 4 * pulse;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(0, 2, player.radius + 10 + 3 * Math.sin(gameTime * 8), 0, Math.PI * 2);
                ctx.stroke();
                ctx.strokeStyle = `rgba(255, 215, 0, ${0.2 + 0.2 * Math.sin(gameTime * 12 + 1)})`;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(0, 2, player.radius + 6 + 2 * Math.sin(gameTime * 6 + 2), 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            if (player.isExecuting) {
                ctx.strokeStyle = `rgba(255, 200, 0, ${0.5 + 0.5 * Math.sin(gameTime * 30)})`;
                ctx.lineWidth = 6;
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.arc(0, 2, player.radius + 16 + 4 * Math.sin(gameTime * 20), 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            if (player.attackAnim > 0) {
                const tilt = player.attackAnim * 0.25;
                ctx.rotate(tilt);
            }

            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 4;

            const skin = SKINS[player.skinIndex] || SKINS[0];
            const flash = player.hitFlash > 0;
            const bodyColor = flash ? '#ffffff' : (player.isBlocking ? lightenColor(skin.body, 20) : skin.body);
            const headColor = flash ? '#ffffff' : lightenColor(skin.body, 15);
            const limbColor = flash ? '#ffffff' : skin.body;
            const facing = player.facing || 0;

            const isMoving = (keys['w'] || keys['a'] || keys['s'] || keys['d']) && !player.isDodging && !player.isBlocking;
            const isDodging = player.isDodging;
            const walkSpeed = isMoving ? 9 : 0;
            const walkPhase = Math.sin(player.walkCycle * walkSpeed);
            const walkBob = isMoving ? Math.abs(Math.sin(player.walkCycle * walkSpeed * 2)) * 2.5 : 0;
            const walkLean = isMoving ? walkPhase * 0.06 : 0;
            const torsoLean = isDodging ? (player.facing > 0 && player.facing < Math.PI ? 0.3 : -0.3) : walkLean;

            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 6;

            // --- 闪避残影 ---
            if (isDodging) {
                const dodgeProgress = 1 - (player.dodgeTimer / player.dodgeDuration);
                const trailCount = 4;
                for (let i = trailCount; i >= 1; i--) {
                    const t = i / trailCount;
                    const trailAlpha = (1 - t) * 0.35 * (1 - dodgeProgress);
                    const trailDist = i * 7;
                    ctx.save();
                    ctx.globalAlpha = trailAlpha;
                    ctx.translate(-Math.cos(player.facing) * trailDist, -Math.sin(player.facing) * trailDist);
                    drawDodgeAfterimage(ctx, player, facing, walkBob, 14, skin, limbColor, headColor, flash);
                    ctx.restore();
                }

                // 风速线条
                ctx.globalAlpha = 0.4 * (1 - dodgeProgress);
                ctx.strokeStyle = '#88ddff';
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                for (let i = 0; i < 6; i++) {
                    const sx = rand(-20, 20);
                    const sy = rand(-15, 25);
                    const len = rand(10, 25);
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx - Math.cos(player.facing) * len, sy - Math.sin(player.facing) * len);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            // --- 腿（带膝盖弯曲） ---
            const legSpread = 5;
            const thighLen = 7;
            const shinLen = 7;
            const legW = 4;
            const walkStride = isMoving ? walkPhase * 0.7 : 0;
            const isFrontLeg = [false, true];
            const footLift = isMoving ? Math.max(0, -walkPhase) * 3 : 0;

            for (let side = -1; side <= 1; side += 2) {
                const idx = side === -1 ? 0 : 1;
                const la = side === -1 ? facing - 0.45 + walkStride : facing + 0.45 - walkStride;
                const lx = Math.cos(la) * legSpread;
                const ly = Math.sin(la) * legSpread + 7 - walkBob;
                const thighAngle = side === -1 ? walkStride * 0.8 : -walkStride * 0.8;
                const kneeAngle = isMoving ? (side === -1 ? Math.max(0, walkPhase) * 0.5 : Math.max(0, -walkPhase) * 0.5) : 0;
                const footOff = side === -1 ? footLift : Math.max(0, walkPhase) * 3;

                ctx.save();
                ctx.translate(lx, ly - footOff);
                ctx.rotate(la + Math.PI / 2);

                // 大腿
                const legGrad = ctx.createLinearGradient(-legW/2, 0, legW/2, 0);
                legGrad.addColorStop(0, lightenColor(limbColor, -20));
                legGrad.addColorStop(0.5, limbColor);
                legGrad.addColorStop(1, lightenColor(limbColor, -20));
                ctx.fillStyle = legGrad;
                ctx.beginPath();
                ctx.roundRect(-legW/2, 0, legW, thighLen, 2);
                ctx.fill();

                // 膝盖
                ctx.fillStyle = lightenColor(limbColor, -10);
                ctx.beginPath();
                ctx.arc(0, thighLen, legW / 2 + 0.5, 0, Math.PI * 2);
                ctx.fill();

                // 小腿（弯曲）
                ctx.save();
                ctx.translate(0, thighLen);
                ctx.rotate(kneeAngle);
                ctx.fillStyle = legGrad;
                ctx.beginPath();
                ctx.roundRect(-legW/2, 0, legW, shinLen, 2);
                ctx.fill();

                // 靴子
                ctx.fillStyle = lightenColor(skin.sword, -10);
                ctx.beginPath();
                ctx.roundRect(-legW/2 - 1, shinLen - 3, legW + 3, 4, 1.5);
                ctx.fill();
                ctx.restore();

                ctx.restore();
            }

            // --- 躯干（带倾斜） ---
            const torsoW = 14;
            const torsoH = 16;
            ctx.save();
            ctx.rotate(torsoLean);
            const grad4 = ctx.createRadialGradient(-3, -3 - walkBob, 2, 0, 2 - walkBob, 12);
            if (flash) {
                grad4.addColorStop(0, '#ffffff');
                grad4.addColorStop(1, '#dddddd');
            } else {
                grad4.addColorStop(0, lightenColor(bodyColor, 30));
                grad4.addColorStop(1, bodyColor);
            }
            ctx.fillStyle = grad4;
            ctx.beginPath();
            ctx.roundRect(-torsoW/2, -2 - walkBob, torsoW, torsoH, 4);
            ctx.fill();

            ctx.fillStyle = lightenColor(skin.sword, -20);
            ctx.fillRect(-torsoW/2 + 1, 9 - walkBob, torsoW - 2, 3);

            // 肩甲（走路时微动）
            const shoulderBob = isMoving ? Math.sin(player.walkCycle * walkSpeed) * 0.08 : 0;
            ctx.fillStyle = lightenColor(skin.sword, 10);
            for (let side = -1; side <= 1; side += 2) {
                const sx = side * (torsoW/2 - 1);
                const shoulderY = -walkBob + side * shoulderBob * 3;
                ctx.beginPath();
                ctx.ellipse(sx, shoulderY, 4, 3, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- 头 ---
            const headY = -13 - walkBob;
            const headR = 9;
            const headGrad = ctx.createRadialGradient(-2, headY - 2, 2, 0, headY, headR);
            if (flash) {
                headGrad.addColorStop(0, '#ffffff');
                headGrad.addColorStop(1, '#dddddd');
            } else {
                headGrad.addColorStop(0, lightenColor(headColor, 25));
                headGrad.addColorStop(1, headColor);
            }
            ctx.fillStyle = headGrad;
            ctx.beginPath();
            ctx.arc(0, headY, headR, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = flash ? '#aaa' : '#2a2a2a';
            ctx.beginPath();
            ctx.arc(0, headY - 2, headR + 1, Math.PI + 0.3, -0.3);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, headY, headR - 1, Math.PI + 0.5, -0.5);
            ctx.fill();

            const eyeOffP = headR * 0.38;
            const eyeAngP = facing;
            for (let side = -1; side <= 1; side += 2) {
                const ex = Math.cos(eyeAngP + side * 0.28) * eyeOffP;
                const ey = Math.sin(eyeAngP + side * 0.28) * eyeOffP + headY;
                ctx.fillStyle = flash ? '#555' : '#f0f0f0';
                ctx.beginPath();
                ctx.ellipse(ex, ey, 3, 2.5, eyeAngP, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111';
                const px = Math.cos(eyeAngP) * 1.5;
                const py = Math.sin(eyeAngP) * 1.5;
                ctx.beginPath();
                ctx.arc(ex + px, ey + py, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            if (player.isBlocking) {
                const blockPulse = Math.sin(gameTime * 10) * 0.3 + 0.7;
                const blockPulse2 = Math.sin(gameTime * 15) * 0.2 + 0.8;
                // 外层虚线环
                ctx.strokeStyle = `rgba(68,170,255,${0.35 * blockPulse})`;
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 4]);
                ctx.beginPath();
                ctx.arc(0, 2, player.radius + 14, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                // 中层弧盾
                ctx.strokeStyle = `rgba(100,180,255,${0.65 * blockPulse})`;
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.arc(0, 2, player.radius + 8, facing - 0.6, facing + 0.6);
                ctx.stroke();
                // 内层发光弧盾
                ctx.strokeStyle = `rgba(200,230,255,${0.55 * blockPulse2})`;
                ctx.lineWidth = 2;
                ctx.shadowColor = '#44aaff';
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.arc(0, 2, player.radius + 10, facing - 0.4, facing + 0.4);
                ctx.stroke();
                // 中心高亮点
                ctx.fillStyle = `rgba(255,255,255,${0.3 * blockPulse})`;
                ctx.shadowColor = '#88ccff';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(Math.cos(facing) * (player.radius + 10), 2 + Math.sin(facing) * (player.radius + 10), 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.setLineDash([]);
            }

            if (player.activeBuffs.attack) {
                ctx.strokeStyle = 'rgba(255,136,68,0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 2, player.radius + 10 + Math.sin(gameTime * 4) * 2, 0, Math.PI * 2);
                ctx.stroke();
            }
            if (player.activeBuffs.shield) {
                ctx.strokeStyle = 'rgba(68,221,255,0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 2, player.radius + 14 + Math.sin(gameTime * 3 + 1) * 2, 0, Math.PI * 2);
                ctx.stroke();
            }

            const swordLen = 32;
            const isAttacking = player.isAttacking;

            // 攻击弧光 - 多层增强
            if (isAttacking) {
                const atkAlpha = player.attackAnim;
                // 残影轨迹
                for (const t of player.trail) {
                    ctx.globalAlpha = t.life / 0.4 * 0.7 * atkAlpha;
                    ctx.beginPath();
                    ctx.arc(t.x - player.x, t.y - player.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffcc66';
                    ctx.shadowColor = '#ffaa33';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                // 外层大弧光
                ctx.globalAlpha = atkAlpha * 0.8;
                ctx.strokeStyle = 'rgba(255,120,30,0.4)';
                ctx.lineWidth = 22;
                ctx.shadowColor = '#ff6622';
                ctx.shadowBlur = 50;
                ctx.beginPath();
                const aStart = facing - player.attackAngle / 2;
                const aEnd = facing + player.attackAngle / 2;
                ctx.arc(0, 2, player.attackRange * 0.75, aStart, aEnd);
                ctx.stroke();
                // 中层弧光
                ctx.globalAlpha = atkAlpha;
                ctx.strokeStyle = 'rgba(255,180,60,0.6)';
                ctx.lineWidth = 12;
                ctx.shadowColor = '#ff8833';
                ctx.shadowBlur = 35;
                ctx.beginPath();
                ctx.arc(0, 2, player.attackRange * 0.7, aStart, aEnd);
                ctx.stroke();
                // 内层高亮
                ctx.strokeStyle = 'rgba(255,240,180,0.5)';
                ctx.lineWidth = 5;
                ctx.shadowColor = '#ffdd88';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(0, 2, player.attackRange * 0.6, aStart + 0.1, aEnd - 0.1);
                ctx.stroke();
                // 刀尖高光点
                const tipAngle = facing + (player.attackAnim - 0.5) * player.attackAngle * 0.8;
                const tipX = Math.cos(tipAngle) * player.attackRange * 0.7;
                const tipY = Math.sin(tipAngle) * player.attackRange * 0.7 + 2;
                ctx.globalAlpha = atkAlpha * 0.9;
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffeecc';
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.arc(tipX, tipY, 4 * atkAlpha, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                // 连击反馈文字
                if (player.combo > 1) {
                    ctx.globalAlpha = Math.min(1, player.comboTime * 2);
                    ctx.fillStyle = player.combo >= 5 ? '#ff4444' : player.combo >= 3 ? '#ffaa00' : '#ffdd44';
                    ctx.font = 'bold ' + (14 + player.combo * 2) + 'px "Segoe UI", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#ff8800';
                    ctx.shadowBlur = 10;
                    ctx.fillText(player.combo + ' COMBO!', 0, -30);
                    ctx.shadowBlur = 0;
                }
                ctx.globalAlpha = 1;
            }

            // --- 挥剑动画角度（增大挥砍幅度）---
            const armSwingAngle = (function() {
                if (player.isBlocking) return 0.5;
                if (player.armSwing < 0) {
                    return player.armSwing * 1.4;
                } else if (player.armSwing < 0.5) {
                    return player.armSwing * 4.5;
                } else {
                    return 2.25 - (player.armSwing - 0.5) * 4.5;
                }
            })();

            // --- 右臂（持剑手）+ 剑 ---
            ctx.save();
            ctx.rotate(facing);

            // 手臂（带手肘弯曲的挥砍动画）
            ctx.save();
            ctx.translate(0, -walkBob);
            ctx.rotate(armSwingAngle);

            // 手肘弯曲角度：格挡时弯曲持剑，攻击预备时大幅弯曲，挥砍时伸展
            const elbowBend = player.isBlocking ? -0.35 : (isDodging ? -0.6 : (player.armSwing < -0.3 ? 1.2 : player.armSwing < 0 ? 0.5 : player.armSwing > 0.5 ? -0.35 : 0));
            ctx.strokeStyle = limbColor;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            // 上臂
            ctx.beginPath();
            ctx.moveTo(torsoW/2 - 3, 2);
            const elbowX = torsoW/2 + 5;
            const elbowY = -1;
            ctx.lineTo(elbowX, elbowY);
            ctx.stroke();
            // 前臂（手肘到手）
            ctx.save();
