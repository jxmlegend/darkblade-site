            ctx.translate(elbowX, elbowY);
            ctx.rotate(elbowBend);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(7, 0);
            ctx.stroke();
            ctx.fillStyle = flash ? '#fff' : lightenColor(headColor, 10);
            ctx.beginPath();
            ctx.arc(7, 0, 3, 0, Math.PI * 2);
            ctx.fill();

            // 剑柄
            const gripLen = 10;
            ctx.fillStyle = '#3a2210';
            ctx.fillRect(7, -2, gripLen, 4);
            ctx.strokeStyle = '#5a3a1a';
            ctx.lineWidth = 0.8;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(8 + i * 2, -2);
                ctx.lineTo(9 + i * 2, 2);
                ctx.stroke();
            }

            // 剑首
            ctx.fillStyle = lightenColor(skin.sword, -10);
            ctx.beginPath();
            ctx.arc(6, 0, 3.5, 0, Math.PI * 2);
            ctx.fill();

            // 护手
            const guardW = 7;
            const gx2 = 7 + gripLen;
            const guardColor = lightenColor(skin.sword, 15);
            ctx.fillStyle = guardColor;
            ctx.beginPath();
            ctx.roundRect(gx2 - 1, -guardW/2, 3, guardW, 1.5);
            ctx.fill();
            ctx.fillStyle = lightenColor(guardColor, -20);
            ctx.beginPath();
            ctx.arc(gx2, -guardW/2, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(gx2, guardW/2, 2, 0, Math.PI * 2);
            ctx.fill();

            // 剑刃
            const bladeStartX2 = gx2 + 2;
            const bladeEndX2 = bladeStartX2 + swordLen;
            const bladeColor = isAttacking ? '#ffcc66' : skin.sword;
            const gradSword = ctx.createLinearGradient(bladeStartX2, 0, bladeEndX2, 0);
            gradSword.addColorStop(0, lightenColor(bladeColor, 20));
            gradSword.addColorStop(0.5, bladeColor);
            gradSword.addColorStop(1, lightenColor(bladeColor, -30));
            ctx.fillStyle = gradSword;
            ctx.shadowColor = isAttacking ? '#ff8844' : 'transparent';
            ctx.shadowBlur = isAttacking ? 25 : 0;
            ctx.beginPath();
            ctx.moveTo(bladeStartX2, -2.5);
            ctx.lineTo(bladeEndX2 - 3, -1.8);
            ctx.lineTo(bladeEndX2, 0);
            ctx.lineTo(bladeEndX2 - 3, 1.8);
            ctx.lineTo(bladeStartX2, 2.5);
            ctx.closePath();
            ctx.fill();
            // 攻击时剑刃发光边缘
            if (isAttacking) {
                ctx.strokeStyle = 'rgba(255,240,200,0.7)';
                ctx.lineWidth = 1.2;
                ctx.shadowColor = '#ffcc88';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(bladeStartX2 + 2, -2.2);
                ctx.lineTo(bladeEndX2 - 3, -1.5);
                ctx.lineTo(bladeEndX2, 0);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
            ctx.strokeStyle = lightenColor(bladeColor, 40);
            ctx.lineWidth = 0.8;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.moveTo(bladeStartX2 + 2, 0);
            ctx.lineTo(bladeEndX2 - 5, 0);
            ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.strokeStyle = lightenColor(bladeColor, 50);
            ctx.lineWidth = 0.5;
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            ctx.moveTo(bladeStartX2 + 1, -2.3);
            ctx.lineTo(bladeEndX2 - 4, -1.6);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(bladeStartX2 + 1, 2.3);
            ctx.lineTo(bladeEndX2 - 4, 1.6);
            ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.shadowBlur = 0;
            ctx.restore(); // forearm
            ctx.restore(); // armSwing
            ctx.restore(); // facing

            // --- 左臂（格挡/自然下垂/走路摆动） ---
            ctx.save();
            ctx.translate(0, -walkBob);
            if (player.isBlocking) {
                // 格挡时左手扶住剑身，形成双手格挡姿态
                const blockAngle = facing > Math.PI ? facing - Math.PI : facing + Math.PI;
                ctx.rotate(blockAngle);
                ctx.strokeStyle = limbColor;
                ctx.lineWidth = 4.5;
                ctx.lineCap = 'round';
                // 上臂向前伸出
                ctx.beginPath();
                ctx.moveTo(-torsoW/2 + 3, 2);
                const lElbowX = -torsoW/2 + 8;
                const lElbowY = -3;
                ctx.lineTo(lElbowX, lElbowY);
                ctx.stroke();
                // 前臂弯曲扶剑
                ctx.save();
                ctx.translate(lElbowX, lElbowY);
                ctx.rotate(-0.6);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(6, 2);
                ctx.stroke();
                ctx.fillStyle = flash ? '#fff' : lightenColor(headColor, 10);
                ctx.beginPath();
                ctx.arc(6, 2, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            } else if (isDodging) {
                // 闪避时手臂向后收
                const dodgeLean = player.facing;
                ctx.rotate(dodgeLean + Math.PI * 0.7);
                ctx.strokeStyle = limbColor;
                ctx.lineWidth = 4.5;
                ctx.lineCap = 'round';
                // 上臂
                ctx.beginPath();
                ctx.moveTo(-torsoW/2 + 3, 2);
                ctx.lineTo(-torsoW/2 - 4, -2);
                ctx.stroke();
                // 前臂收拢
                ctx.beginPath();
                ctx.moveTo(-torsoW/2 - 4, -2);
                ctx.lineTo(-torsoW/2 - 2, -8);
                ctx.stroke();
                ctx.fillStyle = flash ? '#fff' : lightenColor(headColor, 10);
                ctx.beginPath();
                ctx.arc(-torsoW/2 - 2, -8, 2.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // 走路自然摆动 + 手肘弯曲
                const leftSwing = isMoving ? -walkPhase * 0.45 : 0;
                const leftElbow = isMoving ? 0.3 + Math.abs(walkPhase) * 0.2 : 0.2;
                ctx.rotate(leftSwing);
                ctx.strokeStyle = limbColor;
                ctx.lineWidth = 4.5;
                ctx.lineCap = 'round';
                // 上臂
                const upperEndX = -torsoW/2 - 4;
                const upperEndY = 6;
                ctx.beginPath();
                ctx.moveTo(-torsoW/2 + 3, 2);
                ctx.lineTo(upperEndX, upperEndY);
                ctx.stroke();
                // 前臂（弯曲）
                ctx.beginPath();
                ctx.moveTo(upperEndX, upperEndY);
                ctx.lineTo(upperEndX - Math.sin(leftElbow) * 6, upperEndY + Math.cos(leftElbow) * 7);
                ctx.stroke();
                ctx.fillStyle = flash ? '#fff' : lightenColor(headColor, 10);
                ctx.beginPath();
                ctx.arc(upperEndX - Math.sin(leftElbow) * 6, upperEndY + Math.cos(leftElbow) * 7, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            ctx.restore();

            ctx.restore();

            // --- 技能特效 ---
            for (const e of skillEffects) {
                const alpha = e.life / e.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;

                if (e.type === 'q_charge') {
                    // 剑气斩蓄力光环
                    ctx.translate(e.x, e.y);
                    ctx.rotate(e.facing);
                    ctx.strokeStyle = '#66ccff';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#66ccff';
                    ctx.shadowBlur = 25;
                    const expand = (1 - alpha) * 15;
                    ctx.beginPath();
                    ctx.arc(20 + expand, 0, 8 + expand, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = '#aaeeff';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(20 + expand, 0, 12 + expand, 0, Math.PI * 2);
                    ctx.stroke();
                    // 前方聚能线
                    for (let i = 0; i < 3; i++) {
                        const ox = 15 + expand + i * 8;
                        const oy = (i - 1) * 4;
                        ctx.beginPath();
                        ctx.moveTo(ox - 6, oy);
                        ctx.lineTo(ox + 6, oy);
                        ctx.stroke();
                    }
                }

                if (e.type === 'q_wave') {
                    // 剑气波纹扩散
                    ctx.translate(e.x, e.y);
                    ctx.strokeStyle = '#66ccff';
                    ctx.lineWidth = 3 * alpha;
                    ctx.shadowColor = '#66ccff';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(170,230,255,' + (alpha * 0.5) + ')';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, e.radius * 0.8, 0, Math.PI * 2);
                    ctx.stroke();
                }

                if (e.type === 'e_blade') {
                    // 旋风斩旋转刀刃
                    ctx.translate(e.x, e.y);
                    ctx.rotate(e.angle);
                    const bladeLen = e.radius * alpha;
                    ctx.strokeStyle = '#ff8844';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#ff6622';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.moveTo(bladeLen * 0.3, 0);
                    ctx.lineTo(bladeLen, 0);
                    ctx.stroke();
                    ctx.strokeStyle = '#ffcc44';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(bladeLen * 0.5, -1.5);
                    ctx.lineTo(bladeLen, 0);
                    ctx.lineTo(bladeLen * 0.5, 1.5);
                    ctx.stroke();
                }

                if (e.type === 'e_shockwave') {
                    // 旋风斩冲击波环
                    ctx.translate(e.x, e.y);
                    ctx.strokeStyle = '#ffaa44';
                    ctx.lineWidth = 4 * alpha;
                    ctx.shadowColor = '#ff8844';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(255,200,100,' + (alpha * 0.4) + ')';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, e.radius * 0.7, 0, Math.PI * 2);
                    ctx.stroke();
                }

                if (e.type === 'e_vortex') {
                    // 旋风斩中心旋涡
                    ctx.translate(e.x, e.y);
                    ctx.rotate(e.angle);
                    ctx.strokeStyle = '#ff6622';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#ff4400';
                    ctx.shadowBlur = 20;
                    for (let s = 0; s < 3; s++) {
                        const sa = (s / 3) * Math.PI * 2;
                        ctx.beginPath();
                        ctx.arc(0, 0, 15 * alpha, sa, sa + Math.PI * 0.6);
                        ctx.stroke();
                    }
                    ctx.strokeStyle = '#ffcc44';
                    ctx.lineWidth = 1;
                    for (let s = 0; s < 3; s++) {
                        const sa = (s / 3) * Math.PI * 2 + Math.PI * 0.3;
                        ctx.beginPath();
                        ctx.arc(0, 0, 8 * alpha, sa, sa + Math.PI * 0.4);
                        ctx.stroke();
                    }
                }

                ctx.restore();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // 粒子
            for (const p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1;

            for (const d of damageNumbers) {
                const alpha = d.life / d.maxLife;
                ctx.globalAlpha = alpha;
                ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = d.color;
                ctx.fillText(d.text, d.x, d.y);
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1;

            for (const f of floatingTexts) {
                const alpha = Math.min(1, f.life / 20);
                ctx.globalAlpha = alpha;
                ctx.font = 'bold ' + (f.size || 20) + 'px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur = 12;
                ctx.fillStyle = f.color || '#ffffff';
                ctx.fillText(f.text, f.x, f.y);
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1;

            drawHUD();

            ctx.restore();
        }

        // ---- HUD ----
        function drawHUD() {
            const pad = 16;
            const barW = 160;
            const barH = 14;
            const spacing = 6;

            const hpX = pad;
            const hpY = pad;
            drawBar(hpX, hpY, barW, barH, player.hp, player.maxHp, '#cc2222', '#ff4444', 'HP', '#ff6b6b');

            const stX = pad;
            const stY = hpY + barH + spacing;
            drawBar(stX, stY, barW, barH, player.stamina, player.maxStamina, '#cc8822', '#ffcc44', '耐力', '#ffdd44');

            ctx.fillStyle = '#aaa';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Lv.' + player.level + '  EXP: ' + player.exp + '/' + (player.level * 20 + 10), pad, stY + barH +
                spacing + 2);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#888';
            ctx.fillText('击杀 ' + player.kills, W - pad, pad + 4);

            const lvName = LEVELS[currentLevel] ? LEVELS[currentLevel].name : '???';
            ctx.textAlign = 'right';
            ctx.fillStyle = '#666';
            ctx.font = '12px sans-serif';
            ctx.fillText('第 ' + (currentLevel + 1) + ' 关 · ' + lvName, W - pad, pad + 22);

            const alive = enemies.filter(e => !e.isDead && !e.dying).length;
            const total = totalEnemiesInWave || 0;
            ctx.textAlign = 'right';
            ctx.fillStyle = '#555';
            ctx.font = '11px sans-serif';
            ctx.fillText('敌人: ' + alive + '/' + total, W - pad, pad + 40);

            // 道具栏
            const itemY = H - 50;
            const itemSize = 40;
            const itemGap = 6;
            const totalItemW = player.items.length * (itemSize + itemGap) - itemGap;
            const startX = (W - totalItemW) / 2;

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(startX - 8, itemY - 6, totalItemW + 16, itemSize + 14, 8);
                ctx.fill();
            } else {
                ctx.fillRect(startX - 8, itemY - 6, totalItemW + 16, itemSize + 14);
            }
            ctx.shadowBlur = 0;

            for (let i = 0; i < player.items.length; i++) {
                const item = player.items[i];
                const x = startX + i * (itemSize + itemGap);
                const y = itemY;
                const isActive = item.count > 0;
                ctx.strokeStyle = isActive ? 'rgba(255,255,255,0.3)' : 'rgba(100,100,100,0.2)';
                ctx.lineWidth = 1;
                ctx.fillStyle = isActive ? 'rgba(255,255,255,0.08)' : 'rgba(50,50,50,0.3)';
                ctx.fillRect(x, y, itemSize, itemSize);
                ctx.strokeRect(x, y, itemSize, itemSize);
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = isActive ? '#fff' : '#555';
                ctx.fillText(item.icon || '?', x + itemSize / 2, y + itemSize / 2 - 2);
                ctx.font = '10px sans-serif';
                ctx.fillStyle = isActive ? '#ccc' : '#444';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(item.count || 0, x + itemSize - 4, y + itemSize - 2);
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillText((i + 1), x + itemSize / 2, y + itemSize + 2);
            }

            // 技能栏
            const skillY = H - 50;
            const skillX = W - 130;
            const skillSize = 36;
            const skillGap = 4;

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.fillRect(skillX - 4, skillY - 4, skillSize * 2 + skillGap + 8, skillSize + 8);
            ctx.shadowBlur = 0;

            const skills = [
                { key: 'q', label: 'Q', skill: player.skills.q },
                { key: 'e', label: 'E', skill: player.skills.e }
            ];
            for (let i = 0; i < skills.length; i++) {
                const s = skills[i];
                const x = skillX + i * (skillSize + skillGap) + 2;
                const y = skillY;
                const ready = s.skill.cooldown <= 0 && player.stamina >= s.skill.cost;
                ctx.fillStyle = ready ? 'rgba(68,170,255,0.2)' : 'rgba(50,50,50,0.4)';
                ctx.strokeStyle = ready ? 'rgba(68,170,255,0.5)' : 'rgba(80,80,80,0.3)';
                ctx.lineWidth = 1;
                ctx.fillRect(x, y, skillSize, skillSize);
                ctx.strokeRect(x, y, skillSize, skillSize);
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = ready ? '#88ddff' : '#555';
                ctx.fillText(s.skill.icon || '?', x + skillSize / 2, y + skillSize / 2 - 2);
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillText(s.label, x + skillSize / 2, y + skillSize - 2);
                if (s.skill.cooldown > 0) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(x, y, skillSize, skillSize);
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(Math.ceil(s.skill.cooldown) + 's', x + skillSize / 2, y + skillSize / 2);
                }
                ctx.font = '8px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.fillText('⚡' + s.skill.cost, x + skillSize / 2, y + skillSize + 2);
            }

            // 状态提示
            const statusX = pad;
            const statusY = H - 60;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.font = '11px sans-serif';
            let statusText = '';
            if (player.isBlocking) {
                if (player.blockTimer < 0.185) statusText = '⚡ 破防时机!';
                else statusText = '🛡 格挡中';
            } else if (player.isDodging) statusText = '💨 闪避中';
            else if (player.isAttacking) statusText = '⚔ 攻击';
            else if (player.hitCooldown > 0) statusText = '💥 受击';
            else if (player.isExecuting) statusText = '⚡ 处决中!';
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillText(statusText, statusX, statusY);

            let buffText = '';
            if (player.activeBuffs.attack) buffText += ' ⚔攻击+' + player.activeBuffs.attack.value;
            if (player.activeBuffs.shield) buffText += ' 🛡护盾';
            if (buffText) {
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(buffText.trim(), statusX, statusY - 16);
            }

            if (player.killInvincible > 0) {
                ctx.fillStyle = '#ffd700';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText('✨ 无敌 ' + Math.ceil(player.killInvincible * 10) / 10 + 's', statusX, statusY - 32);
            }

            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = '9px sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText('皮肤: ' + SKINS[player.skinIndex].name, W - pad, statusY);
        }

        function drawBar(x, y, w, h, val, max, color1, color2, label, labelColor) {
            const ratio = Math.max(0, Math.min(1, val / max));
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.fillRect(x, y, w, h);
            ctx.shadowBlur = 0;
            const grad = ctx.createLinearGradient(x, y, x + w, y);
            grad.addColorStop(0, color1);
            grad.addColorStop(1, color2);
            ctx.fillStyle = grad;
            ctx.fillRect(x + 2, y + 2, Math.max(0, (w - 4) * ratio), h - 4);
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = labelColor || '#fff';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x + 4, y + h / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = '9px sans-serif';
            ctx.fillText(Math.floor(val) + '/' + max, x + w - 4, y + h / 2 + 0.5);
        }

        function lightenColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, Math.min(255, (num >> 16) + amt));
            const G = Math.max(0, Math.min(255, (num >> 8 & 0x00FF) + amt));
            const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
            return `#${(1 << 24 | R << 16 | G << 8 | B).toString(16).slice(1)}`;
        }

        // ---------- 游戏循环 ----------
        let lastTime = 0;
        let gameStarted = false;
        let loadIntervalId = null;

        function gameLoop(time) {
            const rawDt = Math.min(0.05, (time - lastTime) / 1000);
            const dt = rawDt * timeScale;
            lastTime = time;

            if (state !== GameState.PAUSED) {
                update(dt);
            }
            draw();

            requestAnimationFrame(gameLoop);
        }

        // ---------- 重启 ----------
        restartBtn.addEventListener('click', () => {
            initGame();
            overlay.classList.remove('show');
            state = GameState.PLAYING;
        });

        // ---------- 暂停 ----------
        const pauseOverlay = document.getElementById('pauseOverlay');
        const resumeBtn = document.getElementById('resumeBtn');
        const pauseRestartBtn = document.getElementById('pauseRestartBtn');

        function togglePause() {
            if (state === GameState.PLAYING) {
                state = GameState.PAUSED;
                pauseOverlay.classList.add('show');
                for (const k in keys) keys[k] = false;
            } else if (state === GameState.PAUSED) {
                state = GameState.PLAYING;
                pauseOverlay.classList.remove('show');
                lastTime = performance.now();
            }
        }

        resumeBtn.addEventListener('click', () => {
            if (state === GameState.PAUSED) {
                togglePause();
            }
        });

        pauseRestartBtn.addEventListener('click', () => {
            pauseOverlay.classList.remove('show');
            initGame();
            state = GameState.PLAYING;
            lastTime = performance.now();
        });

        // ---------- 启动 ----------
        function start() {
            if (gameStarted) return;
            gameStarted = true;
            let prog = 0;
            if (loadIntervalId) clearInterval(loadIntervalId);
            loadIntervalId = setInterval(() => {
                prog += rand(2, 8);
                if (prog >= 100) {
                    prog = 100;
                    clearInterval(loadIntervalId);
                    loadIntervalId = null;
                    updateLoad(100);
                    setTimeout(() => {
                        initGame();
                        document.getElementById('controls').style.display = 'flex';
                        var mc = document.getElementById('mobileControls');
                        if (mc) mc.classList.add('show');
                        requestAnimationFrame(gameLoop);
                    }, 200);
                }
                updateLoad(prog);
            }, 60);
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        canvas.addEventListener('contextmenu', e => e.preventDefault());
        // 初始化音频（浏览器需要用户交互后才能播放）
        canvas.addEventListener('click', () => { getAudioCtx(); }, { once: true });
        document.addEventListener('keydown', () => { getAudioCtx(); }, { once: true });

        // 如果已有会话则直接启动，否则等待登录
        if (!currentUser) {
            // 等待用户登录，不自动启动游戏
        }
        console.log('⚔ 深渊断刃 - 破防与处决版 (完美格挡窗口0.2，近战移速降低) 已启动!');
        console.log('🎮 WASD移动 | J攻击/处决 | K格挡(破防时机) | L闪避(无消耗) | 1-4道具 | Q/E技能 | C换皮肤');
        console.log('✨ 完美格挡(0.2秒窗口)可破防敌人，然后按J处决！');

        // ========== Mobile Touch Controls ==========
        (function() {
            const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            if (!isMobile) return;

            const mobileControls = document.getElementById('mobileControls');
            const joystick = document.getElementById('joystick');
            const joystickThumb = document.getElementById('joystickThumb');
            let joyTouchId = null;
            let joyCenter = { x: 0, y: 0 };
            const joyRadius = 55;

            // --- Joystick ---
            function handleJoyStart(e) {
                e.preventDefault();
                const touch = e.changedTouches[0];
                joyTouchId = touch.identifier;
                const rect = joystick.getBoundingClientRect();
                joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                updateJoy(touch);
            }
            function handleJoyMove(e) {
                e.preventDefault();
                for (const touch of e.changedTouches) {
                    if (touch.identifier === joyTouchId) {
                        updateJoy(touch);
                    }
                }
            }
            function handleJoyEnd(e) {
                e.preventDefault();
                for (const touch of e.changedTouches) {
                    if (touch.identifier === joyTouchId) {
                        joyTouchId = null;
                        joystickThumb.style.transform = 'translate(0,0)';
                        keys['w'] = false;
                        keys['a'] = false;
                        keys['s'] = false;
                        keys['d'] = false;
                    }
                }
            }
            function updateJoy(touch) {
                if (state !== GameState.PLAYING) return;
                let dx = touch.clientX - joyCenter.x;
                let dy = touch.clientY - joyCenter.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > joyRadius) {
                    dx = dx / dist * joyRadius;
                    dy = dy / dist * joyRadius;
                }
                joystickThumb.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
                const deadzone = 15;
                keys['w'] = dy < -deadzone;
                keys['s'] = dy > deadzone;
                keys['a'] = dx < -deadzone;
                keys['d'] = dx > deadzone;
            }
            joystick.addEventListener('touchstart', handleJoyStart, { passive: false });
            joystick.addEventListener('touchmove', handleJoyMove, { passive: false });
            joystick.addEventListener('touchend', handleJoyEnd, { passive: false });
            joystick.addEventListener('touchcancel', handleJoyEnd, { passive: false });

            // --- Action Buttons ---
            function setupMobileBtn(el) {
                const key = el.dataset.key;
                if (!key) return;
                el.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    if (state !== GameState.PLAYING) return;
                    getAudioCtx();
                    keys[key] = true;
                    el.classList.add('active');
                }, { passive: false });
                el.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    keys[key] = false;
                    el.classList.remove('active');
                }, { passive: false });
                el.addEventListener('touchcancel', function(e) {
                    keys[key] = false;
                    el.classList.remove('active');
                }, { passive: false });
            }
            document.querySelectorAll('.mobile-btn').forEach(setupMobileBtn);

            // --- Item Buttons ---
            document.querySelectorAll('.mobile-item-btn').forEach(function(el) {
                const key = el.dataset.key;
                el.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    if (state !== GameState.PLAYING) return;
                    getAudioCtx();
                    keys[key] = true;
                    el.classList.add('active');
                }, { passive: false });
                el.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    keys[key] = false;
                    el.classList.remove('active');
                }, { passive: false });
                el.addEventListener('touchcancel', function(e) {
                    keys[key] = false;
                    el.classList.remove('active');
                }, { passive: false });
            });

            // --- Pause Button ---
            document.getElementById('mobilePauseBtn').addEventListener('touchstart', function(e) {
                e.preventDefault();
                getAudioCtx();
                keys['escape'] = true;
                togglePause();
            }, { passive: false });

            // --- Skin Button ---
            document.getElementById('mobileSkinBtn').addEventListener('touchstart', function(e) {
                e.preventDefault();
                keys['c'] = true;
            }, { passive: false });

            // --- Update Item Counts ---
            function updateItemCounts() {
                if (typeof player !== 'undefined' && player.items) {
                    for (let i = 0; i < player.items.length; i++) {
                        const countEl = document.getElementById('itemCount' + (i + 1));
                        if (countEl) countEl.textContent = player.items[i].count;
                    }
                }
            }
            setInterval(updateItemCounts, 500);

            // --- Prevent default touch behavior on game area ---
            document.addEventListener('touchmove', function(e) {
                if (e.target.closest('#mobileControls') || e.target === canvas) {
                    e.preventDefault();
                }
                if (e.target.closest('#authPanel') || e.target.closest('#startScreen')) {
                    return;
                }
            }, { passive: false });

            // --- Handle resize for mobile ---
            function resizeMobile() {
                if (window.innerWidth < 800) {
                    const wrap = document.getElementById('gameWrapper');
                    if (wrap) {
                        wrap.style.width = '100vw';
                        wrap.style.height = '100vh';
                        wrap.style.maxWidth = '100%';
                    }
                }
            }
            window.addEventListener('resize', resizeMobile);
            resizeMobile();
        })();
    </script>
</body>
